<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тестирование · Роадмап Python Backend</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ead9b8">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <style>
    @font-face {
      font-family: 'Fredoka One';
      src: url('fonts/FredokaOneCyrillic-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    :root {
      --bg: #ead9b8;
      --card: #fbf4e4;
      --text: #1a120a;
      --muted: #77664c;
      --accent: #1d4ed8;
      --border: #1a120a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      background-image: repeating-linear-gradient(0deg, rgba(26,18,10,.02) 0 2px, transparent 2px 4px);
      color: var(--text);
      font-family: 'Fredoka One', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-weight: 400;
      line-height: 1.6;
      font-size: 15.5px;
      -webkit-font-smoothing: antialiased;
      max-width: 1140px;
      margin: 0 auto;
      padding: 36px 22px 80px;
    }
    header { display: flex; align-items: flex-start; gap: 28px; }
    header h1 {
      font-size: 44px; font-weight: 400; white-space: nowrap;
      text-transform: uppercase; letter-spacing: .01em; line-height: 50px;
    }
    header .sub { color: var(--muted); font-weight: 400; font-size: 15px; margin-top: 6px; }
    .topnav { display: flex; gap: 10px; flex-shrink: 0; align-items: flex-start; height: 50px; padding-top: 2px; }
    .tn-btn {
      background: var(--card); border: 2px solid var(--border); border-radius: 6px;
      height: 42px; padding: 0 16px; font-size: 15px; color: var(--text);
      font-family: 'Fredoka One', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none; cursor: pointer; box-shadow: 2.5px 2.5px 0 var(--border); transition: all .12s;
    }
    .tn-btn:hover { transform: translate(-1px,-1px); box-shadow: 3.5px 3.5px 0 var(--border); }
    .tn-btn.active {
      background: var(--accent); color: #fff;
      transform: translate(2.5px,2.5px); box-shadow: 0 0 0 var(--border);
    }
    .page-empty { display: flex; justify-content: center; padding: 90px 22px; }
    .pe-card {
      background: var(--card); border: 2px solid var(--border); border-radius: 6px;
      box-shadow: 6px 6px 0 var(--border);
      padding: 46px 60px; text-align: center;
    }
    .pe-ico { font-size: 44px; margin-bottom: 14px; }
    .pe-t { font-size: 24px; text-transform: uppercase; letter-spacing: .01em; }
    .pe-s { font-size: 14px; color: var(--muted); margin-top: 8px; }
    @media (max-width: 900px) {
      header h1 { font-size: 30px; white-space: normal; }
      header { flex-direction: column; gap: 14px; }
      .topnav { height: auto; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Роадмап Python Backend Junior</h1>
      <div class="sub">от основ до работы мечты</div>
    </div>
    <nav class="topnav">
      <a class="tn-btn" href="./">Главная</a>
      <a class="tn-btn active" href="testing.html">Тестирование</a>
      <a class="tn-btn" href="settings.html">Настройки</a>
    </nav>
  </header>

  <div class="page-empty">
    <div class="pe-card">
      <div class="pe-ico">🧪</div>
      <div class="pe-t">Тестирование</div>
      <div class="pe-s">Раздел в разработке</div>
    </div>
  </div>
</body>
</html>
