<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Роадмап · Python Backend</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ead9b8">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <script src="data.js"></script>
  <style>
    /* Fredoka One Cyrillic — Milena B Brandao, SIL OFL 1.1 */
    @font-face {
      font-family: 'Fredoka One';
      src: url('fonts/FredokaOneCyrillic-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    :root {
      --bg: #ead9b8;
      --card: #fbf4e4;
      --text: #1a120a;
      --muted: #77664c;
      --accent: #1d4ed8;
      --green: #4d7c0f;
      --border: #1a120a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      background-image: repeating-linear-gradient(0deg, rgba(26,18,10,.02) 0 2px, transparent 2px 4px);
      color: var(--text);
      font-family: 'Fredoka One', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-weight: 400;
      line-height: 1.6;
      font-size: 15.5px;
      -webkit-font-smoothing: antialiased;
      max-width: 1140px;
      margin: 0 auto;
      padding: 36px 22px 80px;
    }
    header { display: flex; align-items: flex-start; gap: 28px; }
    header h1 {
      font-size: 44px; font-weight: 400; white-space: nowrap;
      text-transform: uppercase; letter-spacing: .01em; line-height: 50px;
    }
    header .sub { color: var(--muted); font-weight: 400; font-size: 15px; margin-top: 6px; }
    .topnav { display: flex; gap: 10px; flex-shrink: 0; align-items: flex-start; height: 50px; padding-top: 2px; }
    .tn-btn {
      background: var(--card); border: 2px solid var(--border); border-radius: 6px;
      height: 42px; padding: 0 16px; font-size: 15px; color: var(--text);
      font-family: 'Fredoka One', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none;
      cursor: pointer; box-shadow: 2.5px 2.5px 0 var(--border); transition: all .12s;
    }
    .tn-btn:hover { transform: translate(-1px,-1px); box-shadow: 3.5px 3.5px 0 var(--border); }
    .tn-btn.active {
      background: var(--accent); color: #fff;
      transform: translate(2.5px,2.5px); box-shadow: 0 0 0 var(--border);
    }
    .screen { display: flex; justify-content: center; padding: 90px 22px; }
    .screen[hidden] { display: none; }
    .sc-card {
      background: var(--card); border: 2px solid var(--border); border-radius: 6px;
      box-shadow: 6px 6px 0 var(--border);
      padding: 46px 60px; text-align: center;
    }
    .sc-ico { font-size: 44px; margin-bottom: 14px; }
    .sc-t { font-size: 24px; text-transform: uppercase; letter-spacing: .01em; }
    .sc-s { font-size: 14px; color: var(--muted); margin-top: 8px; }
    .shell { display: flex; gap: 22px; align-items: flex-start; margin-top: 26px; }
    .shell[hidden] { display: none; }
    .side { width: 300px; flex-shrink: 0; position: sticky; top: 16px; display: flex; flex-direction: column; gap: 14px; }
    .side-prog {
      background: var(--card); border: 2px solid var(--border);
      border-radius: 6px; padding: 8px 16px;
      box-shadow: 6px 6px 0 var(--border);
      height: 100px; display: flex; flex-direction: column; justify-content: center;
    }
    .sp-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .sp-pct { font-size: 26px; font-weight: 400; color: var(--accent); line-height: 1; }
    .sp-l { font-size: 12.5px; color: var(--muted); }
    .sp-track { height: 8px; border-radius: 4px; background: #fff8e8; border: 2px solid var(--border); overflow: hidden; }
    .sp-fill {
      height: 100%; width: 0%;
      background: var(--accent);
      transition: width .5s cubic-bezier(.22,.61,.36,1);
    }
    .nav-btn {
      display: flex; align-items: center; justify-content: center; position: relative; width: 100%;
      padding: 11px 40px;
      background: var(--card); border: 2px solid var(--border); border-radius: 6px;
      cursor: pointer; font-size: 20px; font-weight: 400; color: var(--text);
      font-family: 'Fredoka One', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      transition: all .12s;
      box-shadow: 3px 3px 0 var(--border);
    }
    .nav-btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--border); }
    .nav-btn.active {
      background: var(--accent); color: #fff;
      transform: translate(3px,3px);
      box-shadow: 0 0 0 var(--border);
    }
    .nav-btn .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-btn .c { position: absolute; right: 13px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .nav-btn.active .c { color: #c7d6fe; }
    .nav-btn.complete { background: var(--green); border-color: #3f5e14; color: #fff; box-shadow: 3px 3px 0 #3f5e14; }
    .nav-btn.complete .c { color: #e4f4d8; }
    .nav-btn.complete:hover { box-shadow: 4px 4px 0 #3f5e14; }
    .nav-btn.active.complete { transform: translate(3px,3px); box-shadow: 0 0 0 #3f5e14; }
    .nav-btn.active.complete .c { color: #e4f4d8; }
    .main { flex: 1; min-width: 0; }
    .mhead {
      background: var(--card); border: 2px solid var(--border);
      border-radius: 6px; padding: 16px 20px; margin-bottom: 15px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      box-shadow: 5px 5px 0 var(--border);
      height: 100px; box-sizing: border-box;
    }
    .mhead > div { display: flex; align-items: center; gap: 14px; min-width: 0; flex-wrap: wrap; }
    .mtitle { font-weight: 400; font-size: 24px; line-height: 33px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msub { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .mcount {
      font-size: 13px; color: var(--text); background: var(--card);
      border: 2px solid var(--border); padding: 4px 13px; border-radius: 4px;
      white-space: nowrap; font-variant-numeric: tabular-nums;
      box-shadow: 2px 2px 0 var(--border);
    }
    .mcount.green { background: var(--green); color: #fff; }
    .mlist { background: var(--card); border: 2px solid var(--border); border-radius: 6px; overflow: hidden; box-shadow: 5px 5px 0 var(--border); }
    .day {
      padding: 13px 17px; font-size: 15.5px;
      border-bottom: 1px dashed #d9c9a4;
      display: flex; gap: 11px; align-items: center;
      cursor: pointer; user-select: none; transition: background .12s;
    }
    .day:hover { background: #f5ecd4; }
    .day:last-child { border-bottom: none; }
    .day .t { flex: 1; }
    .day .chev { flex-shrink: 0; display: inline-flex; align-items: center; color: #6b5636; transition: transform .15s; }
    .day.open .chev { transform: rotate(180deg); }
    .day input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 21px; height: 21px; border: 2px solid #6b5636;
      border-radius: 50%; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; transition: all .15s;
    }
    .day input[type=checkbox]:hover { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(29,78,216,.15); }
    .day input[type=checkbox]:checked { background: var(--accent); border-color: var(--border); animation: pop .3s ease; }
    @keyframes pop { 40% { transform: scale(1.25); } }
    .day input[type=checkbox]:checked::after { content: '\2713'; color: #fff; font-size: 12px; line-height: 1; }
    .day.done { opacity: .45; }
    .day.done .t { text-decoration: line-through; }
    .pts { border-top: 1px dashed #d9c9a4; padding: 12px 17px 14px 49px; display: none; }
    .pts.open { display: block; }
    .goal {
      font-size: 14px; color: var(--muted); margin-bottom: 10px;
    }
    .goal b { color: var(--accent); font-style: normal; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; margin-right: 6px; }
    .pt { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); padding: 3px 0; }
    .pt::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #b9a87e; flex-shrink: 0; }
    @media (max-width: 760px) {
      body { padding: 24px 14px 60px; }
      header h1 { font-size: 30px; }
      .shell { flex-direction: column; }
      .side { position: static; width: 100%; flex-direction: row; overflow-x: auto; padding-bottom: 8px; }
      .side-prog { min-width: 220px; }
      .nav-btn { width: auto; white-space: nowrap; }
      .nav-btn .n { max-width: 160px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Роадмап Python Backend Junior</h1>
      <div class="sub">от основ до работы мечты</div>
    </div>
    <nav class="topnav">
      <button class="tn-btn active" data-page="home" onclick="showPage('home')">Главная</button>
      <button class="tn-btn" data-page="testing" onclick="showPage('testing')">Тестирование</button>
      <button class="tn-btn" data-page="settings" onclick="showPage('settings')">Настройки</button>
    </nav>
  </header>

  <div class="shell" id="view-home">
    <aside class="side">
      <div class="side-prog">
        <div class="sp-top">
          <span class="sp-pct" id="progPct">0%</span>
          <span class="sp-l" id="progStats"></span>
        </div>
        <div class="sp-track"><div class="sp-fill" id="progFill"></div></div>
      </div>
      <div id="nav"></div>
    </aside>
    <main class="main" id="content"></main>
  </div>

  <div class="screen" id="view-testing" hidden>
    <div class="sc-card">
      <div class="sc-ico">🧪</div>
      <div class="sc-t">Тестирование</div>
      <div class="sc-s">Раздел в разработке</div>
    </div>
  </div>

  <div class="screen" id="view-settings" hidden>
    <div class="sc-card">
      <div class="sc-ico">⚙️</div>
      <div class="sc-t">Настройки</div>
      <div class="sc-s">Раздел в разработке</div>
    </div>
  </div>

  <script>
    const R = (typeof ROADMAP !== 'undefined') ? ROADMAP : (window.ROADMAP || {});
    const days = R.days || [];

    const GROUP_DESC = {
      'Linux': 'терминал, bash и работа с файлами',
      'Python': 'синтаксис, типизация и ООП языка',
      'Алгоритмы': 'структуры данных и сложность решений',
      'SQL': 'запросы, JOIN и оконные функции',
      'PostgreSQL': 'транзакции и индексы на практике',
      'Git': 'версионирование, ветки и командная работа',
      'Фронтенд': 'HTML, CSS и JavaScript для бэкендера',
      'Flask': 'первый веб-фреймворк и маршруты',
      'Python + БД': 'драйверы, SQLAlchemy и миграции',
      'FastAPI': 'async-фреймворк для современных API',
      'asyncio': 'асинхронный код без блокировок',
      'Docker': 'контейнеры, образы и compose',
      'Сети': 'HTTP, HTTPS, DNS и REST',
      'API-дизайн': 'проектирование понятных REST-интерфейсов',
      'Тестирование': 'pytest и тесты для приложений',
      'Безопасность': 'защита приложений и данных',
      'Очереди': 'фоновые задачи: Celery и RabbitMQ',
      'Карьера': 'резюме, поиск и собеседования',
      'Финал': 'итоги пути и получение оффера'
    };

    const groups = [];
    const groupIndex = {};
    for (const d of days) {
      const prefix = d.module.split(':')[0].trim();
      if (!(prefix in groupIndex)) {
        groupIndex[prefix] = groups.length;
        groups.push({ name: prefix, days: [] });
      }
      groups[groupIndex[prefix]].days.push(d);
    }

    const done = JSON.parse(localStorage.getItem('brt_done') || '[]');
    const openPts = new Set();

    let selGroup = (groups.find(g => !g.days.every(d => done.includes(d.id))) || groups[0]).name;

    function updateProgress() {
      const total = days.length;
      const doneCount = done.filter(id => id >= 1 && id <= total).length;
      const pct = Math.round(doneCount / total * 100);
      document.getElementById('progPct').textContent = pct + '%';
      document.getElementById('progFill').style.width = pct + '%';
      document.getElementById('progStats').textContent = doneCount + '/' + total + ' тем';
    }

    function renderNav() {
      document.getElementById('nav').innerHTML = groups.map(g => {
        const c = g.days.filter(d => done.includes(d.id)).length;
        const all = g.days.every(d => done.includes(d.id));
        return `
        <button class="nav-btn ${g.name === selGroup ? 'active' : ''} ${all ? 'complete' : ''}" onclick="selectGroup('${g.name.replace(/'/g, "\\'")}')">
          <span class="n">${g.name}</span>
          <span class="c">${all ? '✓' : c + '/' + g.days.length}</span>
        </button>`;
      }).join('');
    }

    function renderMain() {
      const g = groups.find(x => x.name === selGroup);
      if (!g) return;
      const c = g.days.filter(d => done.includes(d.id)).length;
      const all = g.days.every(d => done.includes(d.id));
      document.getElementById('content').innerHTML = `
        <div class="mhead">
          <div>
            <div class="mtitle">${g.name}</div>
            <div class="msub">${GROUP_DESC[g.name] || ''}</div>
          </div>
          <span class="mcount ${all ? 'green' : ''}">${all ? '✓ блок завершён' : c + ' из ' + g.days.length}</span>
        </div>
        <div class="mlist">
          ${g.days.map(d => {
            const pts = d.points || [];
            return `
            <div class="day ${done.includes(d.id)?'done':''} ${openPts.has(d.id)?'open':''}" data-id="${d.id}" onclick="togglePts(${d.id})">
              <input type="checkbox" ${done.includes(d.id)?'checked':''} onclick="event.stopPropagation(); toggleDay(${d.id})">
              <span class="t">${d.title}</span>
              <span class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19.1416 9.92896L12.7776 16.2929C12.3871 16.6834 11.7539 16.6834 11.3634 16.2929L4.99946 9.92895" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span>
            </div>
            <div class="pts ${openPts.has(d.id) ? 'open' : ''}" data-pts="${d.id}">
              ${d.goal ? `<div class="goal"><b>Цель</b>${d.goal}</div>` : ''}
              ${pts.map((p) => `
                <div class="pt"><span class="pt-t">${p}</span></div>`).join('')}
            </div>`;
          }).join('')}
        </div>`;
    }

    function selectGroup(name) {
      selGroup = name;
      renderNav();
      renderMain();
    }

    function toggleDay(id) {
      const i = done.indexOf(id);
      if (i >= 0) done.splice(i, 1);
      else done.push(id);
      localStorage.setItem('brt_done', JSON.stringify(done));
      const day = document.querySelector(`.day[data-id="${id}"]`);
      if (day) {
        day.classList.toggle('done', done.includes(id));
        const cb = day.querySelector('input[type=checkbox]');
        if (cb) cb.checked = done.includes(id);
      }
      const g = groups.find(x => x.days.some(d => d.id === id));
      if (g && g.name === selGroup) {
        const c = g.days.filter(d => done.includes(d.id)).length;
        const all = g.days.every(d => done.includes(d.id));
        const mc = document.querySelector('.mcount');
        if (mc) {
          mc.textContent = all ? '✓ блок завершён' : c + ' из ' + g.days.length;
          mc.classList.toggle('green', all);
        }
      }
      renderNav();
      updateProgress();
    }

    function togglePts(id) {
      if (openPts.has(id)) openPts.delete(id);
      else openPts.add(id);
      const el = document.querySelector(`.pts[data-pts="${id}"]`);
      if (el) el.classList.toggle('open');
      const day = document.querySelector(`.day[data-id="${id}"]`);
      if (day) day.classList.toggle('open');
    }

    function showPage(p) {
      document.querySelectorAll('.topnav .tn-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.page === p));
      ['home', 'testing', 'settings'].forEach(n => {
        const el = document.getElementById('view-' + n);
        if (el) el.hidden = (n !== p);
      });
      const want = p === 'home' ? '' : '#/' + p;
      if (location.hash !== want) history.replaceState(null, '', want || location.pathname);
    }

    window.addEventListener('hashchange', () => {
      const h = location.hash.replace(/^#\//, '');
      showPage(['testing', 'settings'].includes(h) ? h : 'home');
    });
    {
      const h0 = location.hash.replace(/^#\//, '');
      showPage(['testing', 'settings'].includes(h0) ? h0 : 'home');
    }

    renderNav();
    renderMain();
    updateProgress();

    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
