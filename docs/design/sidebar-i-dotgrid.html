<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайдбар I · Кобальт: Миллиметровка</title>
  <script src="../data.js"></script>
  <style>
    :root {
      --bg: #ece0c4;
      --card: #fbf4e1;
      --text: #1a120a;
      --muted: #77664c;
      --accent: #1d4ed8;
      --green: #4d7c0f;
      --border: #1a120a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:
        radial-gradient(rgba(26,18,10,.075) 1px, transparent 1.4px),
        var(--bg);
      background-size: 22px 22px, auto;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif;
      line-height: 1.6;
      font-size: 15.5px;
      -webkit-font-smoothing: antialiased;
      max-width: 1140px;
      margin: 0 auto;
      padding: 40px 22px 90px;
      position: relative;
    }
    .preview-tag {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      font-size: 11px; color: #fbf4e1; background: var(--text);
      padding: 5px 12px; border-radius: 6px; font-weight: 650;
      box-shadow: 3px 3px 0 var(--accent);
    }
    header h1 {
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-size: 40px; font-weight: 800; letter-spacing: -.015em; line-height: 1.1;
    }
    header .sub {
      font-family: "Iowan Old Style", Palatino, Georgia, serif; font-style: italic;
      color: var(--muted); font-size: 15px; margin-top: 7px;
    }
    .shell { display: flex; gap: 24px; align-items: flex-start; margin-top: 28px; }
    .side { width: 300px; flex-shrink: 0; position: sticky; top: 20px; display: flex; flex-direction: column; gap: 8px; }
    .side-prog {
      background: var(--card); border: 2px solid var(--border);
      border-radius: 10px; padding: 16px 18px;
      box-shadow: 4px 4px 0 var(--border);
      margin-bottom: 8px;
    }
    .sp-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .sp-pct {
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-size: 40px; font-weight: 800; color: var(--accent); line-height: 1;
    }
    .sp-l { font-size: 12.5px; color: var(--muted); font-weight: 650; }
    .sp-track { height: 13px; border-radius: 99px; background: #f3ead0; border: 1.5px solid var(--border); overflow: hidden; }
    .sp-fill {
      height: 100%; width: 0%; border-radius: 99px;
      background: repeating-linear-gradient(-45deg, var(--accent) 0 9px, #3b82f6 9px 18px);
      transition: width .5s ease;
    }
    .nav-btn {
      display: flex; align-items: center; gap: 10px; width: 100%;
      text-align: left; padding: 8.5px 13px;
      background: var(--card); border: 2px solid var(--border); border-radius: 9px;
      cursor: pointer; font-size: 16.5px; font-weight: 650; color: var(--text);
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      transition: all .14s ease;
      line-height: 1.28;
      box-shadow: 2.5px 2.5px 0 var(--border);
    }
    .nav-btn:hover { transform: translate(-1px,-1px); box-shadow: 3.5px 3.5px 0 var(--border); }
    .nav-btn.active {
      background: var(--accent); color: #fff;
      transform: translate(2.5px,2.5px);
      box-shadow: 0 0 0 var(--border);
    }
    .nav-btn .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-btn .c {
      font-family: -apple-system, "SF Pro Text", sans-serif;
      font-size: 12px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .nav-btn.active .c { color: #c7d6fe; }
    .nav-btn.complete .c { color: var(--green); }
    .nav-btn.active.complete .c { color: #d9f99d; }
    .main { flex: 1; min-width: 0; }
    .mhead {
      background: var(--card); border: 2px solid var(--border);
      border-radius: 10px; padding: 17px 20px; margin-bottom: 15px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      box-shadow: 4px 4px 0 var(--border);
    }
    .mtitle {
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-weight: 800; font-size: 24px; letter-spacing: -.01em;
    }
    .msub { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .mcount {
      font-size: 13px; color: var(--text); background: var(--card);
      border: 2px solid var(--border); padding: 4px 13px; border-radius: 99px;
      white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums;
      box-shadow: 2px 2px 0 var(--border);
    }
    .mcount.green { background: var(--green); border-color: var(--green); color: #fff; }
    .mlist { background: var(--card); border: 2px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: 4px 4px 0 var(--border); }
    .day {
      padding: 13px 17px; font-size: 15.5px;
      border-bottom: 1px dashed #d9c9a4;
      display: flex; gap: 11px; align-items: center;
      cursor: pointer; user-select: none; transition: background .13s;
    }
    .day:hover { background: #f5ecd0; }
    .day:last-child { border-bottom: none; }
    .day .t { flex: 1; font-weight: 550; }
    .day input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 21px; height: 21px; border: 2px solid #a08b64;
      border-radius: 50%; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; transition: all .15s ease;
    }
    .day input[type=checkbox]:hover { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(29,78,216,.13); }
    .day input[type=checkbox]:checked { background: var(--accent); border-color: var(--border); animation: pop .3s ease; }
    @keyframes pop { 40% { transform: scale(1.22); } }
    .day input[type=checkbox]:checked::after { content: '\2713'; color: #fff; font-size: 12px; font-weight: 800; line-height: 1; }
    .day.done { opacity: .42; }
    .day.done .t { text-decoration: line-through; }
    .cnt { color: var(--muted); font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .cnt.green { color: var(--green); }
    .pts { border-top: 1px dashed #d9c9a4; padding: 12px 17px 14px 49px; display: none; }
    .pts.open { display: block; }
    .goal { font-size: 13.5px; color: var(--muted); margin-bottom: 10px; line-height: 1.55; }
    .goal b { color: var(--accent); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; margin-right: 7px; font-weight: 750; }
    .pt { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); cursor: pointer; padding: 3.5px 0; }
    .pt input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 16px; height: 16px; border: 2px solid #a08b64;
      border-radius: 50%; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; transition: all .15s ease;
    }
    .pt input[type=checkbox]:checked { background: var(--accent); border-color: var(--border); }
    .pt input[type=checkbox]:checked::after { content: '\2713'; color: #fff; font-size: 9px; font-weight: 800; line-height: 1; }
    .pt.done { color: var(--text); opacity: .75; }
    .pt.done .pt-t { text-decoration: line-through; }
    @media (max-width: 760px) {
      .shell { flex-direction: column; }
      .side { position: static; width: 100%; flex-direction: row; overflow-x: auto; padding-bottom: 8px; }
      .side-prog { min-width: 220px; }
      .nav-btn { width: auto; white-space: nowrap; }
      .nav-btn .n { max-width: 160px; }
    }
  </style>
</head>
<body>
  <span class="preview-tag">I · МИЛЛИМЕТРОВКА</span>
  <header>
    <h1>Роадмап Python Backend Junior</h1>
    <div class="sub">план обучения на четыре месяца</div>
  </header>

  <div class="shell">
    <aside class="side">
      <div class="side-prog">
        <div class="sp-top">
          <span class="sp-pct" id="progPct">0%</span>
          <span class="sp-l" id="progStats"></span>
        </div>
        <div class="sp-track"><div class="sp-fill" id="progFill"></div></div>
      </div>
      <div id="nav"></div>
    </aside>
    <main class="main" id="content"></main>
  </div>

  <script>
    const R = (typeof ROADMAP !== 'undefined') ? ROADMAP : (window.ROADMAP || {});
    const days = R.days || [];
    const PHASES = (R.meta && R.meta.phases) || {};

    const groups = [];
    const groupIndex = {};
    for (const d of days) {
      const prefix = d.module.split(':')[0].trim();
      if (!(prefix in groupIndex)) {
        groupIndex[prefix] = groups.length;
        groups.push({ name: prefix, days: [], phase: d.phase });
      }
      groups[groupIndex[prefix]].days.push(d);
    }

    const done = JSON.parse(localStorage.getItem('brt_done') || '[]');
    const ptsDone = JSON.parse(localStorage.getItem('brt_pts') || '{}');
    const openPts = new Set();

    let selGroup = (groups.find(g => !g.days.every(d => done.includes(d.id))) || groups[0]).name;

    function updateProgress() {
      const total = days.length;
      const doneCount = done.filter(id => id >= 1 && id <= total).length;
      const pct = Math.round(doneCount / total * 100);
      document.getElementById('progPct').textContent = pct + '%';
      document.getElementById('progFill').style.width = pct + '%';
      document.getElementById('progStats').textContent = doneCount + '/' + total + ' тем';
    }

    function renderNav() {
      document.getElementById('nav').innerHTML = groups.map(g => {
        const c = g.days.filter(d => done.includes(d.id)).length;
        const all = g.days.every(d => done.includes(d.id));
        return `
        <button class="nav-btn ${g.name === selGroup ? 'active' : ''} ${all ? 'complete' : ''}" onclick="selectGroup('${g.name.replace(/'/g, "\\'")}')">
          <span class="n">${g.name}</span>
          <span class="c">${all ? '✓' : c + '/' + g.days.length}</span>
        </button>`;
      }).join('');
    }

    function renderMain() {
      const g = groups.find(x => x.name === selGroup);
      if (!g) return;
      const ph = PHASES[g.phase];
      const c = g.days.filter(d => done.includes(d.id)).length;
      const all = g.days.every(d => done.includes(d.id));
      document.getElementById('content').innerHTML = `
        <div class="mhead">
          <div>
            <div class="mtitle">${g.name}</div>
            <div class="msub">${ph ? 'Фаза ' + g.phase + ' · ' + ph.name : ''}${ph && ph.days ? ' · ' + ph.days : ''}</div>
          </div>
          <span class="mcount ${all ? 'green' : ''}">${all ? '✓ блок завершён' : c + ' из ' + g.days.length}</span>
        </div>
        <div class="mlist">
          ${g.days.map(d => {
            const pts = d.points || [];
            const dp = ptsDone[d.id] || [];
            const allDone = pts.length > 0 && dp.length === pts.length;
            return `
            <div class="day ${done.includes(d.id)?'done':''}" data-id="${d.id}" onclick="togglePts(${d.id})">
              <input type="checkbox" ${done.includes(d.id)?'checked':''} onclick="event.stopPropagation(); toggleDay(${d.id})">
              <span class="t">${d.title}</span>
              <span class="cnt ${allDone ? 'green' : ''}">${dp.length}/${pts.length}</span>
            </div>
            <div class="pts ${openPts.has(d.id) ? 'open' : ''}" data-pts="${d.id}">
              ${d.goal ? `<div class="goal"><b>Цель</b>${d.goal}</div>` : ''}
              ${pts.map((p, i) => `
                <label class="pt ${dp.includes(i)?'done':''}">
                  <input type="checkbox" ${dp.includes(i)?'checked':''} onchange="togglePt(${d.id},${i})">
                  <span class="pt-t">${p}</span>
                </label>`).join('')}
            </div>`;
          }).join('')}
        </div>`;
    }

    function selectGroup(name) {
      selGroup = name;
      renderNav();
      renderMain();
    }

    function refreshNav() { renderNav(); }

    function toggleDay(id) {
      const i = done.indexOf(id);
      if (i >= 0) done.splice(i, 1);
      else done.push(id);
      localStorage.setItem('brt_done', JSON.stringify(done));
      const day = document.querySelector(`.day[data-id="${id}"]`);
      if (day) {
        day.classList.toggle('done', done.includes(id));
        const cb = day.querySelector('input[type=checkbox]');
        if (cb) cb.checked = done.includes(id);
      }
      const g = groups.find(x => x.days.some(d => d.id === id));
      if (g && g.name === selGroup) {
        const c = g.days.filter(d => done.includes(d.id)).length;
        const all = g.days.every(d => done.includes(d.id));
        const mc = document.querySelector('.mcount');
        if (mc) {
          mc.textContent = all ? '✓ блок завершён' : c + ' из ' + g.days.length;
          mc.classList.toggle('green', all);
        }
      }
      renderNav();
      updateProgress();
    }

    function togglePts(id) {
      if (openPts.has(id)) openPts.delete(id);
      else openPts.add(id);
      const el = document.querySelector(`.pts[data-pts="${id}"]`);
      if (el) el.classList.toggle('open');
    }

    function togglePt(id, idx) {
      let arr = ptsDone[id] || [];
      const i = arr.indexOf(idx);
      if (i >= 0) arr.splice(i, 1);
      else arr.push(idx);
      arr.sort((a, b) => a - b);
      ptsDone[id] = arr;
      localStorage.setItem('brt_pts', JSON.stringify(ptsDone));
      const pts = days.find(x => x.id === id)?.points || [];
      const cnt = document.querySelector(`.day[data-id="${id}"] .cnt`);
      if (cnt) {
        cnt.textContent = arr.length + '/' + pts.length;
        cnt.classList.toggle('green', pts.length > 0 && arr.length === pts.length);
      }
      const label = event.target.closest('.pt');
      if (label) label.classList.toggle('done', event.target.checked);
    }

    renderNav();
    renderMain();
    updateProgress();
  </script>
</body>
</html>
