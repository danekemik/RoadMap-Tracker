<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компоновка 5 · Таймлайн</title>
  <script src="../data.js"></script>
  <style>
    :root {
      --bg: #e8dcc3;
      --card: #f3ead6;
      --text: #433422;
      --muted: #8a7658;
      --accent: #b45309;
      --green: #6b7c2e;
      --border: #d3c3a0;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      background-image: repeating-linear-gradient(0deg, rgba(67,52,34,.02) 0 2px, transparent 2px 4px);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      line-height: 1.6;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      max-width: 780px;
      margin: 0 auto;
      padding: 36px 20px 80px;
    }
    .preview-tag {
      position: fixed; top: 12px; right: 12px; z-index: 1000;
      font-size: 11px; color: #fff; background: var(--accent);
      padding: 4px 11px; border-radius: 4px; font-weight: 600;
    }
    header { text-align: center; }
    h1 { font-family: Georgia, serif; font-size: 29px; font-weight: 700; }
    .sub { font-family: Georgia, serif; font-style: italic; color: var(--muted); font-size: 14px; margin-top: 5px; }
    .sub::before, .sub::after { content: ' ~ '; color: var(--accent); font-style: normal; }
    .prog-panel {
      position: relative;
      margin-top: 24px; padding: 18px 22px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; box-shadow: 0 2px 0 rgba(67,52,34,.08), 0 8px 24px rgba(67,52,34,.08);
    }
    .prog-panel::before {
      content: '';
      position: absolute; top: -11px; left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 116px; height: 22px;
      background: rgba(180,83,9,.28);
      border-left: 1px dashed rgba(255,253,247,.6);
      border-right: 1px dashed rgba(255,253,247,.6);
    }
    .prog-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 11px; }
    .prog-stats { font-size: 14.5px; font-weight: 600; }
    .prog-stats b { color: var(--accent); }
    .prog-pct { font-family: Georgia, serif; font-size: 36px; font-weight: 700; color: var(--accent); line-height: 1; }
    .prog-track {
      height: 13px; border-radius: 99px; background: #e2d5b8;
      border: 1px solid var(--border); overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(67,52,34,.1);
    }
    .prog-fill {
      height: 100%; width: 0%; border-radius: 99px;
      background: repeating-linear-gradient(-45deg, var(--accent) 0 10px, #d97316 10px 20px);
      transition: width .5s cubic-bezier(.22,.61,.36,1);
    }
    .tl { position: relative; padding-left: 32px; margin-top: 10px; }
    .tl::before {
      content: '';
      position: absolute; left: 11px; top: 6px; bottom: 6px; width: 2px;
      background: var(--border);
    }
    .wkl { position: relative; margin: 24px 0 10px; display: flex; align-items: center; gap: 10px; }
    .wkl::before {
      content: '';
      position: absolute; left: -27px;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--bg); border: 2.5px solid var(--accent);
      box-shadow: 0 0 0 3px rgba(180,83,9,.15);
    }
    .wt { font-family: Georgia, serif; font-weight: 700; font-size: 16px; }
    .wc {
      font-size: 11px; color: var(--muted);
      border: 1px solid var(--border); background: var(--bg);
      padding: 1px 9px; border-radius: 99px; font-variant-numeric: tabular-nums;
    }
    .wc.green { color: var(--green); border-color: var(--green); background: #f2f4e3; font-weight: 700; }
    .tentry { position: relative; margin-bottom: 8px; }
    .tentry::before {
      content: '';
      position: absolute; left: -25px; top: 17px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--card); border: 2px solid var(--muted);
      transition: all .2s;
    }
    .tentry.done::before { background: var(--green); border-color: var(--green); }
    .tcard {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; overflow: hidden;
      box-shadow: 0 1px 0 rgba(67,52,34,.06), 0 4px 12px rgba(67,52,34,.05);
    }
    .trow {
      display: flex; gap: 10px; padding: 10px 14px;
      align-items: center; cursor: pointer; user-select: none;
      transition: background .12s;
    }
    .trow:hover { background: #efe5cd; }
    .trow input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 18px; height: 18px; border: 1.5px solid #bfae8a;
      border-radius: 50%; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; transition: all .15s;
    }
    .trow input[type=checkbox]:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(180,83,9,.12); }
    .trow input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); animation: pop .3s ease; }
    @keyframes pop { 40% { transform: scale(1.25); } }
    .trow input[type=checkbox]:checked::after { content: '✓'; color: #fff; font-size: 10px; font-weight: 800; line-height: 1; }
    .tt { flex: 1; font-size: 14px; }
    .tm {
      font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted); border: 1px solid var(--border);
      padding: 1px 7px; border-radius: 99px; white-space: nowrap; background: var(--bg);
    }
    .tcnt { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .tcnt.green { color: var(--green); font-weight: 700; }
    .tentry.done .tt { text-decoration: line-through; opacity: .5; }
    .tbody { border-top: 1px dashed var(--border); padding: 10px 14px 12px 42px; display: none; }
    .tbody.open { display: block; }
    .goal {
      font-family: Georgia, serif; font-style: italic;
      font-size: 13px; color: var(--muted); margin-bottom: 8px;
    }
    .goal b { color: var(--accent); font-style: normal; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; margin-right: 6px; }
    .pt { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted); cursor: pointer; padding: 2.5px 0; }
    .pt input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 14px; height: 14px; border: 1.5px solid #bfae8a;
      border-radius: 50%; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; transition: all .15s;
    }
    .pt input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
    .pt input[type=checkbox]:checked::after { content: '✓'; color: #fff; font-size: 9px; font-weight: 800; line-height: 1; }
    .pt.done { color: var(--text); opacity: .75; }
    .pt.done .pt-t { text-decoration: line-through; }
  </style>
</head>
<body>
  <span class="preview-tag">КОМПОНОВКА 5 · ТАЙМЛАЙН</span>
  <header>
    <h1>Роадмап Python Backend Junior</h1>
    <div class="sub">план обучения на четыре месяца</div>
    <div class="prog-panel">
      <div class="prog-top">
        <span class="prog-stats" id="progStats"></span>
        <span class="prog-pct" id="progPct">0%</span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-labels" style="display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px;"><span>неделя 1</span><span>неделя 20</span></div>
    </div>
  </header>

  <div class="tl" id="tl"></div>

  <script>
    const R = (typeof ROADMAP !== 'undefined') ? ROADMAP : (window.ROADMAP || {});
    const days = R.days || [];

    const done = JSON.parse(localStorage.getItem('brt_done') || '[]');
    const ptsDone = JSON.parse(localStorage.getItem('brt_pts') || '{}');
    const openT = new Set();

    function updateProgress() {
      const total = days.length;
      const doneCount = done.filter(id => id >= 1 && id <= total).length;
      const pct = Math.round(doneCount / total * 100);
      document.getElementById('progStats').innerHTML =
        'Изучено <b>' + doneCount + '</b> из <b>' + total + '</b> тем · 20 недель';
      document.getElementById('progPct').textContent = pct + '%';
      document.getElementById('progFill').style.width = pct + '%';
    }

    function render() {
      updateProgress();
      let html = '';
      let lastWeek = null;
      for (const d of days) {
        if (d.week !== lastWeek) {
          lastWeek = d.week;
          const wd = days.filter(x => x.week === d.week);
          const wc = wd.filter(x => done.includes(x.id)).length;
          const wall = wd.every(x => done.includes(x.id));
          html += `
          <div class="wkl" data-wk="${d.week}">
            <span class="wt">Неделя ${d.week}</span>
            <span class="wc ${wall ? 'green' : ''}">${wall ? '✓' : wc + '/' + wd.length}</span>
          </div>`;
        }
        const pts = d.points || [];
        const dp = ptsDone[d.id] || [];
        const allDone = pts.length > 0 && dp.length === pts.length;
        html += `
        <div class="tentry ${done.includes(d.id)?'done':''}" data-id="${d.id}">
          <div class="tcard">
            <div class="trow" onclick="toggleT(${d.id})">
              <input type="checkbox" ${done.includes(d.id)?'checked':''} onclick="event.stopPropagation(); toggleDay(${d.id})">
              <span class="tt">${d.title}</span>
              <span class="tm">${d.module.split(':')[0].trim()}</span>
              <span class="tcnt ${allDone ? 'green' : ''}">${dp.length}/${pts.length}</span>
            </div>
            <div class="tbody ${openT.has(d.id) ? 'open' : ''}" data-tbody="${d.id}">
              ${d.goal ? `<div class="goal"><b>Цель</b>${d.goal}</div>` : ''}
              ${pts.map((p, i) => `
                <label class="pt ${dp.includes(i)?'done':''}">
                  <input type="checkbox" ${dp.includes(i)?'checked':''} onchange="togglePt(${d.id},${i})">
                  <span class="pt-t">${p}</span>
                </label>`).join('')}
            </div>
          </div>
        </div>`;
      }
      document.getElementById('tl').innerHTML = html;
    }

    function refreshWeek(wk) {
      const wkl = document.querySelector(`.wkl[data-wk="${wk}"]`);
      if (!wkl) return;
      const wd = days.filter(x => x.week === wk);
      const wc = wd.filter(x => done.includes(x.id)).length;
      const wall = wd.every(x => done.includes(x.id));
      const el = wkl.querySelector('.wc');
      el.textContent = wall ? '✓' : wc + '/' + wd.length;
      el.classList.toggle('green', wall);
    }

    function toggleDay(id) {
      const i = done.indexOf(id);
      if (i >= 0) done.splice(i, 1);
      else done.push(id);
      localStorage.setItem('brt_done', JSON.stringify(done));
      const entry = document.querySelector(`.tentry[data-id="${id}"]`);
      if (entry) {
        entry.classList.toggle('done', done.includes(id));
        const cb = entry.querySelector('input[type=checkbox]');
        if (cb) cb.checked = done.includes(id);
      }
      const day = days.find(x => x.id === id);
      if (day) refreshWeek(day.week);
      updateProgress();
    }

    function toggleT(id) {
      if (openT.has(id)) openT.delete(id);
      else openT.add(id);
      const el = document.querySelector(`[data-tbody="${id}"]`);
      if (el) el.classList.toggle('open');
    }

    function togglePt(id, idx) {
      let arr = ptsDone[id] || [];
      const i = arr.indexOf(idx);
      if (i >= 0) arr.splice(i, 1);
      else arr.push(idx);
      arr.sort((a, b) => a - b);
      ptsDone[id] = arr;
      localStorage.setItem('brt_pts', JSON.stringify(ptsDone));
      const pts = days.find(x => x.id === id)?.points || [];
      const cnt = document.querySelector(`.tentry[data-id="${id}"] .tcnt`);
      if (cnt) {
        cnt.textContent = arr.length + '/' + pts.length;
        cnt.classList.toggle('green', pts.length > 0 && arr.length === pts.length);
      }
      const label = event.target.closest('.pt');
      if (label) label.classList.toggle('done', event.target.checked);
    }

    render();
  </script>
</body>
</html>
