<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вариант 4 · Неон</title>
  <meta name="theme-color" content="#0d0221">
  <script src="../data.js"></script>
  <style>
    :root {
      --bg: #0d0221;
      --bg2: rgba(255,255,255,.04);
      --text: #efeaff;
      --muted: #9181b3;
      --accent: #ff3df2;
      --cyan: #22d3ee;
      --green: #a3e635;
      --border: rgba(255,61,242,.22);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(255,61,242,.14), transparent),
        radial-gradient(ellipse 70% 45% at 90% 10%, rgba(34,211,238,.10), transparent),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      line-height: 1.6;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 18px 70px;
    }
    .preview-tag {
      position: fixed; top: 12px; right: 12px; z-index: 1000;
      font-size: 11px; color: #0d0221; background: linear-gradient(90deg, var(--accent), var(--cyan));
      padding: 4px 11px; border-radius: 99px; font-weight: 700;
      box-shadow: 0 0 16px rgba(255,61,242,.5);
    }
    header { margin-bottom: 24px; }
    h1 {
      font-size: 21px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
      background: linear-gradient(90deg, var(--cyan), var(--accent));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .prog-panel {
      margin-top: 18px; padding: 19px 21px; border-radius: 18px;
      background: var(--bg2);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      box-shadow: 0 0 28px rgba(255,61,242,.12), inset 0 0 20px rgba(255,61,242,.03);
    }
    .prog-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 13px; }
    .prog-stats { font-size: 15.5px; font-weight: 600; }
    .prog-stats b { color: var(--cyan); }
    .prog-stats em { font-style: normal; color: var(--muted); font-weight: 450; font-size: 13.5px; }
    .prog-pct {
      font-size: 40px; font-weight: 900; letter-spacing: -.02em; line-height: 1;
      background: linear-gradient(90deg, var(--cyan), var(--accent));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(255,61,242,.45));
      font-variant-numeric: tabular-nums;
    }
    .prog-track {
      height: 14px; border-radius: 99px; background: rgba(0,0,0,.5);
      border: 1px solid rgba(255,255,255,.09); overflow: hidden;
    }
    .prog-fill {
      height: 100%; width: 0%; border-radius: 99px;
      background: linear-gradient(90deg, var(--cyan), var(--accent));
      box-shadow: 0 0 14px rgba(255,61,242,.65), 0 0 30px rgba(34,211,238,.3);
      transition: width .5s cubic-bezier(.22,.61,.36,1);
    }
    .prog-labels {
      display: flex; justify-content: space-between;
      color: var(--muted); font-size: 12.5px; margin-top: 7px;
      font-variant-numeric: tabular-nums;
    }
    details {
      border: 1px solid rgba(145,129,179,.2); border-radius: 16px;
      margin-bottom: 10px; overflow: hidden;
      background: var(--bg2);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      transition: border-color .2s, box-shadow .2s;
    }
    details:hover { border-color: var(--border); }
    details[open] { box-shadow: 0 0 22px rgba(255,61,242,.08); }
    summary {
      list-style: none; display: flex; align-items: center; gap: 11px;
      padding: 15px 18px; cursor: pointer; user-select: none;
      font-weight: 700; font-size: 17px;
    }
    summary::-webkit-details-marker { display: none; }
    summary .arrow { color: var(--accent); font-size: 11px; transition: transform .15s; width: 12px; }
    details[open] summary .arrow { transform: rotate(90deg); }
    summary .wk {
      background: linear-gradient(90deg, #fff, #c9b8f0);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    summary .cnt {
      color: var(--cyan); font-size: 12px; font-weight: 600; margin-left: auto;
      border: 1px solid rgba(34,211,238,.3); background: rgba(34,211,238,.07);
      padding: 2px 10px; border-radius: 99px; font-variant-numeric: tabular-nums;
    }
    .days { border-top: 1px solid rgba(145,129,179,.15); }
    .day {
      padding: 12px 18px; font-size: 15px;
      border-bottom: 1px solid rgba(145,129,179,.12);
      display: flex; gap: 11px; align-items: center;
      cursor: pointer; user-select: none; transition: background .12s;
    }
    .day:hover { background: rgba(255,61,242,.05); }
    .day:last-child { border-bottom: none; }
    .day .t { flex: 1; }
    .day input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 19px; height: 19px; border: 1.5px solid rgba(145,129,179,.55);
      border-radius: 6px; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; transition: all .15s;
    }
    .day input[type=checkbox]:hover {
      border-color: var(--accent); box-shadow: 0 0 10px rgba(255,61,242,.4);
    }
    .day input[type=checkbox]:checked {
      background: linear-gradient(135deg, var(--cyan), var(--accent));
      border-color: var(--accent); animation: pop .3s ease;
      box-shadow: 0 0 12px rgba(255,61,242,.55);
    }
    @keyframes pop { 40% { transform: scale(1.25); } }
    .day input[type=checkbox]:checked::after {
      content: '✓'; color: #fff; font-size: 12px; font-weight: 800; line-height: 1;
    }
    .day.done { opacity: .42; }
    .day.done .t { text-decoration: line-through; }
    .phase-tag {
      color: var(--muted); font-size: 10.5px; margin-left: auto;
      border: 1px solid rgba(145,129,179,.25); padding: 1px 8px; border-radius: 99px;
    }
    .prog { color: var(--muted); font-size: 12px; font-weight: 500; margin-left: auto; font-variant-numeric: tabular-nums; }
    .pts { padding: 2px 18px 14px 48px; display: flex; flex-direction: column; gap: 8px; }
    .pts.hidden { display: none; }
    .pt { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
    .pt input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 16px; height: 16px; border: 1.5px solid rgba(145,129,179,.55);
      border-radius: 5px; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; transition: all .15s;
    }
    .pt input[type=checkbox]:checked {
      background: linear-gradient(135deg, var(--cyan), var(--accent)); border-color: var(--accent);
    }
    .pt input[type=checkbox]:checked::after { content: '✓'; color: #fff; font-size: 10px; font-weight: 800; line-height: 1; }
    .pt.done { color: var(--text); opacity: .75; }
    .pt.done .pt-t { text-decoration: line-through; }
    .cnt.green {
      color: var(--green); border-color: rgba(163,230,53,.4); background: rgba(163,230,53,.08);
    }
  </style>
</head>
<body>
  <span class="preview-tag">ВАРИАНТ 4 · НЕОН</span>
  <header>
    <h1>Роадмап · Python Backend</h1>
    <div class="prog-panel" id="progPanel">
      <div class="prog-top">
        <span class="prog-stats" id="progStats"></span>
        <span class="prog-pct" id="progPct">0%</span>
      </div>
      <div class="prog-track">
        <div class="prog-fill" id="progFill"></div>
      </div>
      <div class="prog-labels">
        <span>старт</span>
        <span id="progMax"></span>
      </div>
    </div>
  </header>
  <div id="list"></div>

  <script>
    const R = (typeof ROADMAP !== 'undefined') ? ROADMAP : (window.ROADMAP || {});
    const days = R.days || [];

    const groups = [];
    const groupIndex = {};
    for (const d of days) {
      const prefix = d.module.split(':')[0].trim();
      if (!(prefix in groupIndex)) {
        groupIndex[prefix] = groups.length;
        groups.push({ name: prefix, days: [], phase: d.phase });
      }
      groups[groupIndex[prefix]].days.push(d);
    }

    const done = JSON.parse(localStorage.getItem('brt_done') || '[]');
    const ptsDone = JSON.parse(localStorage.getItem('brt_pts') || '{}');
    const openPts = new Set();

    const openGroups = new Set();
    document.getElementById('list').addEventListener('toggle', e => {
      const details = e.target;
      const name = details.querySelector('.wk')?.textContent;
      if (!name) return;
      if (details.open) openGroups.add(name);
      else openGroups.delete(name);
    });

    function updateProgress() {
      const total = days.length;
      const doneCount = done.filter(id => id >= 1 && id <= total).length;
      const pct = Math.round(doneCount / total * 100);
      document.getElementById('progStats').innerHTML =
        'Изучено <b>' + doneCount + '</b> из <b>' + total + '</b> тем' +
        ' <em>· ' + groups.length + ' блоков</em>';
      document.getElementById('progPct').textContent = pct + '%';
      document.getElementById('progFill').style.width = pct + '%';
      document.getElementById('progMax').textContent = total;
    }

    function render() {
      updateProgress();

      const list = document.getElementById('list');
      list.innerHTML = groups.map(g => {
        const open = openGroups.has(g.name);
        const blockDone = g.days.every(d => done.includes(d.id));
        const blockCount = g.days.filter(d => done.includes(d.id)).length;
        return `
          <details ${open ? 'open' : ''}>
            <summary>
              <span class="arrow">▶</span>
              <span class="wk">${g.name}</span>
              <span class="cnt">${blockDone ? '✓' : blockCount + '/' + g.days.length}</span>
            </summary>
            <div class="days">
              ${g.days.map(d => {
                const pts = d.points || [];
                const dp = ptsDone[d.id] || [];
                const doneCount = dp.length;
                const allDone = pts.length > 0 && doneCount === pts.length;
                const open = openPts.has(d.id);
                return `
                <div class="day ${done.includes(d.id)?'done':''}" data-id="${d.id}" onclick="togglePts(${d.id})">
                  <input type="checkbox" ${done.includes(d.id)?'checked':''} onclick="event.stopPropagation(); toggleDay(${d.id})">
                  <span class="t">${d.title}</span>
                  <span class="phase-tag">${d.module.split(':').slice(1).join(':').trim()}</span>
                  <span class="cnt ${allDone ? 'green' : ''}">${doneCount}/${pts.length}</span>
                </div>
                <div class="pts ${open ? '' : 'hidden'}" data-pts="${d.id}">
                  ${pts.map((p, i) => `
                    <label class="pt ${dp.includes(i)?'done':''}">
                      <input type="checkbox" ${dp.includes(i)?'checked':''} onchange="togglePt(${d.id},${i})">
                      <span class="pt-t">${p}</span>
                    </label>
                  `).join('')}
                </div>
                `;
              }).join('')}
            </div>
          </details>`;
      }).join('');
    }

    function toggleDay(id) {
      const i = done.indexOf(id);
      if (i >= 0) done.splice(i, 1);
      else done.push(id);
      localStorage.setItem('brt_done', JSON.stringify(done));
      const day = document.querySelector(`.day[data-id="${id}"]`);
      if (day) {
        day.classList.toggle('done', done.includes(id));
        const cb = day.querySelector('input[type=checkbox]');
        if (cb) cb.checked = done.includes(id);
        const details = day.closest('details');
        const group = details && details.querySelector('.wk')?.textContent;
        const g = groups.find(x => x.name === group);
        if (g && details) {
          const cnt = details.querySelector('.cnt');
          const blockCount = g.days.filter(d => done.includes(d.id)).length;
          const blockDone = g.days.every(d => done.includes(d.id));
          if (cnt) cnt.textContent = blockDone ? '✓' : blockCount + '/' + g.days.length;
        }
        updateProgress();
      }
    }

    function togglePts(id) {
      if (openPts.has(id)) openPts.delete(id);
      else openPts.add(id);
      const el = document.querySelector(`.pts[data-pts="${id}"]`);
      if (el) el.classList.toggle('hidden');
    }

    function togglePt(id, idx) {
      let arr = ptsDone[id] || [];
      const i = arr.indexOf(idx);
      if (i >= 0) arr.splice(i, 1);
      else arr.push(idx);
      arr.sort((a, b) => a - b);
      ptsDone[id] = arr;
      localStorage.setItem('brt_pts', JSON.stringify(ptsDone));
      const pts = days.find(x => x.id === id)?.points || [];
      const cnt = document.querySelector(`.day[data-id="${id}"] .cnt`);
      if (cnt) {
        cnt.textContent = arr.length + '/' + pts.length;
        cnt.classList.toggle('green', pts.length > 0 && arr.length === pts.length);
      }
      const label = event.target.closest('.pt');
      if (label) label.classList.toggle('done', event.target.checked);
    }

    render();
  </script>
</body>
</html>
