<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вариант 1A · Терминал: Янтарь</title>
  <meta name="theme-color" content="#050805">
  <script src="../data.js"></script>
  <style>
    :root {
      --bg: #0a0500;
      --bg2: #150c02;
      --text: #ffcf87;
      --muted: #a07840;
      --accent: #ffb000;
      --green: #ffb000;
      --border: #3d2b0e;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      line-height: 1.65;
      font-size: 14.5px;
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 18px 60px;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(255,176,0,.03) 0 1px, transparent 1px 3px);
      pointer-events: none;
      z-index: 999;
    }
    .preview-tag {
      position: fixed; top: 12px; right: 12px; z-index: 1000;
      font-size: 11px; color: var(--bg); background: var(--accent);
      padding: 3px 10px; border-radius: 3px; font-weight: 700;
    }
    .term-bar {
      display: flex; align-items: center; gap: 7px;
      background: var(--bg2); border: 1px solid var(--border);
      border-bottom: none; border-radius: 8px 8px 0 0;
      padding: 9px 14px;
    }
    .term-bar i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    .term-bar i:nth-child(1) { background: #ff5f56; }
    .term-bar i:nth-child(2) { background: #ffbd2e; }
    .term-bar i:nth-child(3) { background: #27c93f; }
    .term-bar span { margin-left: auto; margin-right: auto; font-size: 11.5px; color: var(--muted); }
    .term-body {
      border: 1px solid var(--border); border-radius: 0 0 8px 8px;
      padding: 20px 18px 26px; background: rgba(21,12,2,.5);
    }
    h1 { font-size: 16px; font-weight: 600; letter-spacing: 0; }
    .prompt { color: var(--accent); }
    .cursor { display: inline-block; width: 9px; height: 17px; background: var(--accent); vertical-align: -3px; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .prog-panel {
      margin-top: 16px; padding: 15px 16px;
      border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg2);
    }
    .prog-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .prog-stats { font-size: 13.5px; }
    .prog-stats b { color: var(--accent); font-weight: 700; }
    .prog-stats em { font-style: normal; color: var(--muted); font-size: 12.5px; }
    .prog-pct {
      font-size: 30px; font-weight: 700; color: var(--accent);
      text-shadow: 0 0 14px rgba(255,176,0,.45); line-height: 1;
    }
    .prog-track {
      height: 12px; border-radius: 2px; background: #120a00;
      border: 1px solid var(--border); overflow: hidden;
    }
    .prog-fill {
      height: 100%; width: 0%;
      background: repeating-linear-gradient(90deg, var(--accent) 0 8px, #b36b00 8px 10px);
      box-shadow: 0 0 10px rgba(255,176,0,.45);
      transition: width .5s steps(20);
    }
    .prog-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; margin-top: 5px; }
    details {
      border: 1px solid var(--border); border-radius: 4px;
      margin-bottom: 8px; background: rgba(21,12,2,.5); overflow: hidden;
    }
    summary {
      list-style: none; display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; cursor: pointer; font-weight: 600; font-size: 15px;
      user-select: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary:hover { background: rgba(255,176,0,.06); }
    summary .arrow { color: var(--accent); font-size: 11px; transition: transform .15s; width: 12px; }
    details[open] summary .arrow { transform: rotate(90deg); }
    summary .wk::before { content: './ '; color: var(--muted); font-weight: 400; }
    summary .cnt { color: var(--muted); font-size: 12px; margin-left: auto; }
    .days { border-top: 1px dashed var(--border); }
    .day {
      padding: 9px 14px; font-size: 14px; border-bottom: 1px dashed var(--border);
      display: flex; gap: 10px; align-items: center; cursor: pointer; user-select: none;
    }
    .day:hover { background: rgba(255,176,0,.05); }
    .day:last-child { border-bottom: none; }
    .day .t { flex: 1; }
    .day input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 17px; height: 17px; border: 1px solid var(--muted);
      border-radius: 3px; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; transition: all .15s; position: relative;
    }
    .day input[type=checkbox]:hover { border-color: var(--accent); box-shadow: 0 0 8px rgba(255,176,0,.35); }
    .day input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); animation: pop .25s ease; }
    @keyframes pop { 40% { transform: scale(1.2); } }
    .day input[type=checkbox]:checked::after {
      content: 'x'; color: #1a0e00; font-size: 12px; font-weight: 800; line-height: 1;
    }
    .day.done { opacity: .45; }
    .day.done .t { text-decoration: line-through; }
    .phase-tag { color: var(--muted); font-size: 10.5px; margin-left: auto; }
    .phase-tag::before { content: '#'; }
    .prog { color: var(--muted); font-size: 11.5px; margin-left: auto; }
    .pts { padding: 2px 16px 12px 41px; display: flex; flex-direction: column; gap: 5px; }
    .pts.hidden { display: none; }
    .pt { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--muted); cursor: pointer; }
    .pt input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 14px; height: 14px; border: 1px solid var(--muted);
      border-radius: 3px; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; transition: all .15s;
    }
    .pt input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
    .pt input[type=checkbox]:checked::after { content: 'x'; color: #1a0e00; font-size: 10px; font-weight: 800; line-height: 1; }
    .pt.done { color: var(--text); opacity: .7; }
    .pt.done .pt-t { text-decoration: line-through; }
    .cnt.green { color: var(--accent); }
  </style>
</head>
<body>
  <span class="preview-tag">ВАРИАНТ 1A · ЯНТАРЬ</span>
  <div class="term-bar"><i></i><i></i><i></i><span>pamela@backend — zsh — 80×24</span></div>
  <div class="term-body">
    <header>
      <h1><span class="prompt">pamela@dev:~$</span> cat roadmap.txt<span class="cursor"></span></h1>
      <div class="prog-panel" id="progPanel">
        <div class="prog-top">
          <span class="prog-stats" id="progStats"></span>
          <span class="prog-pct" id="progPct">0%</span>
        </div>
        <div class="prog-track">
          <div class="prog-fill" id="progFill"></div>
        </div>
        <div class="prog-labels">
          <span>[0]</span>
          <span id="progMax"></span>
        </div>
      </div>
    </header>
    <div id="list" style="margin-top:16px"></div>
  </div>

  <script>
    const R = (typeof ROADMAP !== 'undefined') ? ROADMAP : (window.ROADMAP || {});
    const days = R.days || [];

    const groups = [];
    const groupIndex = {};
    for (const d of days) {
      const prefix = d.module.split(':')[0].trim();
      if (!(prefix in groupIndex)) {
        groupIndex[prefix] = groups.length;
        groups.push({ name: prefix, days: [], phase: d.phase });
      }
      groups[groupIndex[prefix]].days.push(d);
    }

    const done = JSON.parse(localStorage.getItem('brt_done') || '[]');
    const ptsDone = JSON.parse(localStorage.getItem('brt_pts') || '{}');
    const openPts = new Set();

    const openGroups = new Set();
    document.getElementById('list').addEventListener('toggle', e => {
      const details = e.target;
      const name = details.querySelector('.wk')?.textContent;
      if (!name) return;
      if (details.open) openGroups.add(name);
      else openGroups.delete(name);
    });

    function updateProgress() {
      const total = days.length;
      const doneCount = done.filter(id => id >= 1 && id <= total).length;
      const pct = Math.round(doneCount / total * 100);
      document.getElementById('progStats').innerHTML =
        'Изучено <b>' + doneCount + '</b> из <b>' + total + '</b> тем' +
        ' <em>· ' + groups.length + ' блоков</em>';
      document.getElementById('progPct').textContent = pct + '%';
      document.getElementById('progFill').style.width = pct + '%';
      document.getElementById('progMax').textContent = '[' + total + ']';
    }

    function render() {
      updateProgress();

      const list = document.getElementById('list');
      list.innerHTML = groups.map(g => {
        const open = openGroups.has(g.name);
        const blockDone = g.days.every(d => done.includes(d.id));
        const blockCount = g.days.filter(d => done.includes(d.id)).length;
        return `
          <details ${open ? 'open' : ''}>
            <summary>
              <span class="arrow">▶</span>
              <span class="wk">${g.name}</span>
              <span class="cnt">${blockDone ? '[✓]' : blockCount + '/' + g.days.length}</span>
            </summary>
            <div class="days">
              ${g.days.map(d => {
                const pts = d.points || [];
                const dp = ptsDone[d.id] || [];
                const doneCount = dp.length;
                const allDone = pts.length > 0 && doneCount === pts.length;
                const open = openPts.has(d.id);
                return `
                <div class="day ${done.includes(d.id)?'done':''}" data-id="${d.id}" onclick="togglePts(${d.id})">
                  <input type="checkbox" ${done.includes(d.id)?'checked':''} onclick="event.stopPropagation(); toggleDay(${d.id})">
                  <span class="t">${d.title}</span>
                  <span class="phase-tag">${d.module.split(':').slice(1).join(':').trim()}</span>
                  <span class="cnt ${allDone ? 'green' : ''}">${doneCount}/${pts.length}</span>
                </div>
                <div class="pts ${open ? '' : 'hidden'}" data-pts="${d.id}">
                  ${pts.map((p, i) => `
                    <label class="pt ${dp.includes(i)?'done':''}">
                      <input type="checkbox" ${dp.includes(i)?'checked':''} onchange="togglePt(${d.id},${i})">
                      <span class="pt-t">${p}</span>
                    </label>
                  `).join('')}
                </div>
                `;
              }).join('')}
            </div>
          </details>`;
      }).join('');
    }

    function toggleDay(id) {
      const i = done.indexOf(id);
      if (i >= 0) done.splice(i, 1);
      else done.push(id);
      localStorage.setItem('brt_done', JSON.stringify(done));
      const day = document.querySelector(`.day[data-id="${id}"]`);
      if (day) {
        day.classList.toggle('done', done.includes(id));
        const cb = day.querySelector('input[type=checkbox]');
        if (cb) cb.checked = done.includes(id);
        const details = day.closest('details');
        const group = details && details.querySelector('.wk')?.textContent;
        const g = groups.find(x => x.name === group);
        if (g && details) {
          const cnt = details.querySelector('.cnt');
          const blockCount = g.days.filter(d => done.includes(d.id)).length;
          const blockDone = g.days.every(d => done.includes(d.id));
          if (cnt) cnt.textContent = blockDone ? '[✓]' : blockCount + '/' + g.days.length;
        }
        updateProgress();
      }
    }

    function togglePts(id) {
      if (openPts.has(id)) openPts.delete(id);
      else openPts.add(id);
      const el = document.querySelector(`.pts[data-pts="${id}"]`);
      if (el) el.classList.toggle('hidden');
    }

    function togglePt(id, idx) {
      let arr = ptsDone[id] || [];
      const i = arr.indexOf(idx);
      if (i >= 0) arr.splice(i, 1);
      else arr.push(idx);
      arr.sort((a, b) => a - b);
      ptsDone[id] = arr;
      localStorage.setItem('brt_pts', JSON.stringify(ptsDone));
      const pts = days.find(x => x.id === id)?.points || [];
      const cnt = document.querySelector(`.day[data-id="${id}"] .cnt`);
      if (cnt) {
        cnt.textContent = arr.length + '/' + pts.length;
        cnt.classList.toggle('green', pts.length > 0 && arr.length === pts.length);
      }
      const label = event.target.closest('.pt');
      if (label) label.classList.toggle('done', event.target.checked);
    }

    render();
  </script>
</body>
</html>
