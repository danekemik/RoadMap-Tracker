<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компоновка 3 · Вкладки по фазам</title>
  <script src="../data.js"></script>
  <style>
    :root {
      --bg: #e8dcc3;
      --card: #f3ead6;
      --text: #433422;
      --muted: #8a7658;
      --accent: #b45309;
      --green: #6b7c2e;
      --border: #d3c3a0;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      background-image: repeating-linear-gradient(0deg, rgba(67,52,34,.02) 0 2px, transparent 2px 4px);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      line-height: 1.6;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      max-width: 780px;
      margin: 0 auto;
      padding: 36px 20px 80px;
    }
    .preview-tag {
      position: fixed; top: 12px; right: 12px; z-index: 1000;
      font-size: 11px; color: #fff; background: var(--accent);
      padding: 4px 11px; border-radius: 4px; font-weight: 600;
    }
    header { text-align: center; }
    h1 { font-family: Georgia, serif; font-size: 29px; font-weight: 700; }
    .sub { font-family: Georgia, serif; font-style: italic; color: var(--muted); font-size: 14px; margin-top: 5px; }
    .sub::before, .sub::after { content: ' ~ '; color: var(--accent); font-style: normal; }
    .prog-panel {
      position: relative;
      margin-top: 24px; padding: 18px 22px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; box-shadow: 0 2px 0 rgba(67,52,34,.08), 0 8px 24px rgba(67,52,34,.08);
    }
    .prog-panel::before {
      content: '';
      position: absolute; top: -11px; left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 116px; height: 22px;
      background: rgba(180,83,9,.28);
      border-left: 1px dashed rgba(255,253,247,.6);
      border-right: 1px dashed rgba(255,253,247,.6);
    }
    .prog-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 11px; }
    .prog-stats { font-size: 14.5px; font-weight: 600; }
    .prog-stats b { color: var(--accent); }
    .prog-stats em { font-style: normal; color: var(--muted); font-weight: 400; font-size: 13px; }
    .prog-pct { font-family: Georgia, serif; font-size: 36px; font-weight: 700; color: var(--accent); line-height: 1; }
    .prog-track {
      height: 13px; border-radius: 99px; background: #e2d5b8;
      border: 1px solid var(--border); overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(67,52,34,.1);
    }
    .prog-fill {
      height: 100%; width: 0%; border-radius: 99px;
      background: repeating-linear-gradient(-45deg, var(--accent) 0 10px, #d97316 10px 20px);
      transition: width .5s cubic-bezier(.22,.61,.36,1);
    }
    .prog-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; }
    .tabbar {
      display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap;
    }
    .tab {
      padding: 9px 16px; background: var(--card);
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 13.5px; font-weight: 600; color: var(--muted);
      cursor: pointer; font-family: inherit; transition: all .12s;
    }
    .tab:hover { background: #efe5cd; color: var(--text); }
    .tab.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(180,83,9,.3);
    }
    .tab .tc { font-weight: 500; font-size: 11.5px; opacity: .75; margin-left: 5px; font-variant-numeric: tabular-nums; }
    .ph-note {
      margin-top: 14px; padding: 0 4px;
      font-family: Georgia, serif; font-style: italic;
      font-size: 13px; color: var(--muted);
    }
    .ph-note b { color: var(--accent); font-style: normal; }
    details {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; margin-top: 14px; overflow: hidden;
      box-shadow: 0 1px 0 rgba(67,52,34,.06), 0 6px 18px rgba(67,52,34,.06);
    }
    summary {
      list-style: none; display: flex; align-items: center; gap: 11px;
      padding: 14px 18px; cursor: pointer; user-select: none;
      font-family: Georgia, serif; font-weight: 700; font-size: 17px;
    }
    summary::-webkit-details-marker { display: none; }
    summary:hover { background: #efe5cd; }
    summary .arrow { color: var(--accent); font-size: 11px; transition: transform .15s; width: 12px; }
    details[open] summary .arrow { transform: rotate(90deg); }
    summary .cnt {
      color: var(--muted); font-size: 12px; font-weight: 500; margin-left: auto;
      font-family: -apple-system, sans-serif;
      background: var(--bg); border: 1px solid var(--border);
      padding: 2px 9px; border-radius: 99px; font-variant-numeric: tabular-nums;
    }
    .days { border-top: 1px dashed var(--border); }
    .day {
      padding: 11px 18px; font-size: 14.5px;
      border-bottom: 1px dashed var(--border);
      display: flex; gap: 11px; align-items: center;
      cursor: pointer; user-select: none; transition: background .12s;
    }
    .day:hover { background: #efe5cd; }
    .day:last-child { border-bottom: none; }
    .day .t { flex: 1; }
    .day input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 19px; height: 19px; border: 1.5px solid #bfae8a;
      border-radius: 50%; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; transition: all .15s;
    }
    .day input[type=checkbox]:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(180,83,9,.12); }
    .day input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); animation: pop .3s ease; }
    @keyframes pop { 40% { transform: scale(1.25); } }
    .day input[type=checkbox]:checked::after { content: '✓'; color: #fff; font-size: 11px; font-weight: 800; line-height: 1; }
    .day.done { opacity: .45; }
    .day.done .t { text-decoration: line-through; }
    .cnt { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .cnt.green { color: var(--green); font-weight: 700; }
    .pts { border-top: 1px dashed var(--border); padding: 11px 18px 13px 48px; display: none; }
    .pts.open { display: block; }
    .goal {
      font-family: Georgia, serif; font-style: italic;
      font-size: 13px; color: var(--muted); margin-bottom: 9px;
    }
    .goal b { color: var(--accent); font-style: normal; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; margin-right: 6px; }
    .pt { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--muted); cursor: pointer; padding: 2.5px 0; }
    .pt input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 15px; height: 15px; border: 1.5px solid #bfae8a;
      border-radius: 50%; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; transition: all .15s;
    }
    .pt input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
    .pt input[type=checkbox]:checked::after { content: '✓'; color: #fff; font-size: 9px; font-weight: 800; line-height: 1; }
    .pt.done { color: var(--text); opacity: .75; }
    .pt.done .pt-t { text-decoration: line-through; }
  </style>
</head>
<body>
  <span class="preview-tag">КОМПОНОВКА 3 · ВКЛАДКИ</span>
  <header>
    <h1>Роадмап Python Backend Junior</h1>
    <div class="sub">план обучения на четыре месяца</div>
    <div class="prog-panel">
      <div class="prog-top">
        <span class="prog-stats" id="progStats"></span>
        <span class="prog-pct" id="progPct">0%</span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-labels"><span>начало</span><span id="progMax"></span></div>
    </div>
  </header>

  <div class="tabbar" id="tabbar"></div>
  <div class="ph-note" id="phNote"></div>
  <div id="list"></div>

  <script>
    const R = (typeof ROADMAP !== 'undefined') ? ROADMAP : (window.ROADMAP || {});
    const days = R.days || [];
    const PHASES = (R.meta && R.meta.phases) || {};

    const groups = [];
    const groupIndex = {};
    for (const d of days) {
      const prefix = d.module.split(':')[0].trim();
      if (!(prefix in groupIndex)) {
        groupIndex[prefix] = groups.length;
        groups.push({ name: prefix, days: [], phase: d.phase });
      }
      groups[groupIndex[prefix]].days.push(d);
    }

    const done = JSON.parse(localStorage.getItem('brt_done') || '[]');
    const ptsDone = JSON.parse(localStorage.getItem('brt_pts') || '{}');
    const openPts = new Set();
    const openGroups = new Set();

    let activePhase = 0;

    function updateProgress() {
      const total = days.length;
      const doneCount = done.filter(id => id >= 1 && id <= total).length;
      const pct = Math.round(doneCount / total * 100);
      document.getElementById('progStats').innerHTML =
        'Изучено <b>' + doneCount + '</b> из <b>' + total + '</b> тем' +
        ' <em>· ' + groups.length + ' блоков</em>';
      document.getElementById('progPct').textContent = pct + '%';
      document.getElementById('progFill').style.width = pct + '%';
      document.getElementById('progMax').textContent = total + ' тем';
    }

    function renderTabs() {
      document.getElementById('tabbar').innerHTML = Object.keys(PHASES).map(p => {
        const gd = days.filter(d => d.phase == p);
        const c = gd.filter(d => done.includes(d.id)).length;
        return `
        <button class="tab ${activePhase == p ? 'active' : ''}" onclick="setPhase(${p})">
          ${p} · ${PHASES[p].name}<span class="tc">${c}/${gd.length}</span>
        </button>`;
      }).join('');
      const ph = PHASES[activePhase];
      document.getElementById('phNote').innerHTML =
        '<b>' + ph.days + '.</b> ' + ph.note;
    }

    function renderList() {
      const list = document.getElementById('list');
      const gs = groups.filter(g => g.phase == activePhase);
      list.innerHTML = gs.map(g => {
        const open = openGroups.has(g.name);
        const blockDone = g.days.every(d => done.includes(d.id));
        const blockCount = g.days.filter(d => done.includes(d.id)).length;
        return `
        <details ${open ? 'open' : ''}>
          <summary>
            <span class="arrow">▶</span>
            <span class="wk">${g.name}</span>
            <span class="cnt">${blockDone ? '✓' : blockCount + '/' + g.days.length}</span>
          </summary>
          <div class="days">
            ${g.days.map(d => {
              const pts = d.points || [];
              const dp = ptsDone[d.id] || [];
              const allDone = pts.length > 0 && dp.length === pts.length;
              return `
              <div class="day ${done.includes(d.id)?'done':''}" data-id="${d.id}" onclick="togglePts(${d.id})">
                <input type="checkbox" ${done.includes(d.id)?'checked':''} onclick="event.stopPropagation(); toggleDay(${d.id})">
                <span class="t">${d.title}</span>
                <span class="cnt ${allDone ? 'green' : ''}">${dp.length}/${pts.length}</span>
              </div>
              <div class="pts ${openPts.has(d.id) ? 'open' : ''}" data-pts="${d.id}">
                ${d.goal ? `<div class="goal"><b>Цель</b>${d.goal}</div>` : ''}
                ${pts.map((p, i) => `
                  <label class="pt ${dp.includes(i)?'done':''}">
                    <input type="checkbox" ${dp.includes(i)?'checked':''} onchange="togglePt(${d.id},${i})">
                    <span class="pt-t">${p}</span>
                  </label>`).join('')}
              </div>`;
            }).join('')}
          </div>
        </details>`;
      }).join('');
    }

    function setPhase(p) { activePhase = p; renderTabs(); renderList(); }

    document.getElementById('list').addEventListener('toggle', e => {
      const name = e.target.querySelector('.wk')?.textContent;
      if (!name) return;
      if (e.target.open) openGroups.add(name);
      else openGroups.delete(name);
    });

    function toggleDay(id) {
      const i = done.indexOf(id);
      if (i >= 0) done.splice(i, 1);
      else done.push(id);
      localStorage.setItem('brt_done', JSON.stringify(done));
      const day = document.querySelector(`.day[data-id="${id}"]`);
      if (day) {
        day.classList.toggle('done', done.includes(id));
        const cb = day.querySelector('input[type=checkbox]');
        if (cb) cb.checked = done.includes(id);
        const details = day.closest('details');
        const gname = details && details.querySelector('.wk')?.textContent;
        const g = groups.find(x => x.name === gname);
        if (g && details) {
          const cnt = details.querySelector('.cnt');
          const bc = g.days.filter(d => done.includes(d.id)).length;
          const ball = g.days.every(d => done.includes(d.id));
          if (cnt) cnt.textContent = ball ? '✓' : bc + '/' + g.days.length;
        }
      }
      renderTabs();
      updateProgress();
    }

    function togglePts(id) {
      if (openPts.has(id)) openPts.delete(id);
      else openPts.add(id);
      const el = document.querySelector(`.pts[data-pts="${id}"]`);
      if (el) el.classList.toggle('open');
    }

    function togglePt(id, idx) {
      let arr = ptsDone[id] || [];
      const i = arr.indexOf(idx);
      if (i >= 0) arr.splice(i, 1);
      else arr.push(idx);
      arr.sort((a, b) => a - b);
      ptsDone[id] = arr;
      localStorage.setItem('brt_pts', JSON.stringify(ptsDone));
      const pts = days.find(x => x.id === id)?.points || [];
      const cnt = document.querySelector(`.day[data-id="${id}"] .cnt`);
      if (cnt) {
        cnt.textContent = arr.length + '/' + pts.length;
        cnt.classList.toggle('green', pts.length > 0 && arr.length === pts.length);
      }
      const label = event.target.closest('.pt');
      if (label) label.classList.toggle('done', event.target.checked);
    }

    renderTabs();
    renderList();
    updateProgress();
  </script>
</body>
</html>
