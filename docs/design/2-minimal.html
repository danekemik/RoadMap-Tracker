<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вариант 2 · Минимализм</title>
  <meta name="theme-color" content="#ffffff">
  <script src="../data.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --bg2: #fafafa;
      --text: #18181b;
      --muted: #71717a;
      --accent: #4f46e5;
      --green: #059669;
      --border: #e4e4e7;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      line-height: 1.6;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    .preview-tag {
      position: fixed; top: 12px; right: 12px; z-index: 1000;
      font-size: 11px; color: #fff; background: var(--accent);
      padding: 4px 11px; border-radius: 99px; font-weight: 600;
    }
    header { margin-bottom: 28px; }
    h1 {
      font-size: 26px; font-weight: 750; letter-spacing: -.02em;
      padding-bottom: 18px; border-bottom: 1px solid var(--border);
    }
    .prog-panel {
      margin-top: 22px; display: flex; align-items: center; gap: 22px;
    }
    .prog-pct {
      font-size: 52px; font-weight: 800; letter-spacing: -.03em;
      color: var(--accent); line-height: 1; min-width: 118px;
      font-variant-numeric: tabular-nums;
    }
    .prog-right { flex: 1; }
    .prog-stats { font-size: 14.5px; color: var(--muted); display: block; margin-bottom: 9px; }
    .prog-stats b { color: var(--text); font-weight: 650; }
    .prog-track {
      height: 6px; border-radius: 99px; background: var(--border); overflow: hidden;
    }
    .prog-fill {
      height: 100%; width: 0%; border-radius: 99px;
      background: var(--accent);
      transition: width .6s cubic-bezier(.22,.61,.36,1);
    }
    .prog-labels {
      display: flex; justify-content: space-between;
      color: var(--muted); font-size: 12px; margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }
    details {
      border-bottom: 1px solid var(--border);
      background: transparent; overflow: hidden;
    }
    details:first-of-type { border-top: 1px solid var(--border); }
    summary {
      list-style: none; display: flex; align-items: center; gap: 12px;
      padding: 16px 4px; cursor: pointer; font-weight: 600; font-size: 16.5px;
      user-select: none; transition: color .15s;
    }
    summary::-webkit-details-marker { display: none; }
    summary:hover { color: var(--accent); }
    summary .arrow {
      color: var(--muted); font-size: 10px; transition: transform .15s; width: 12px;
    }
    details[open] summary .arrow { transform: rotate(90deg); }
    summary .wk { letter-spacing: -.01em; }
    summary .cnt {
      color: var(--muted); font-size: 12.5px; font-weight: 550; margin-left: auto;
      background: var(--bg2); border: 1px solid var(--border);
      padding: 2px 9px; border-radius: 99px; font-variant-numeric: tabular-nums;
    }
    .days { border-top: 1px dashed var(--border); }
    .day {
      padding: 12px 4px 12px 26px; font-size: 15px;
      display: flex; gap: 11px; align-items: center;
      cursor: pointer; user-select: none; position: relative;
      transition: background .12s;
    }
    .day:hover { background: var(--bg2); }
    .day .t { flex: 1; }
    .day input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 19px; height: 19px; border: 1.5px solid #d4d4d8;
      border-radius: 99px; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; transition: all .15s; margin-left: -26px;
    }
    .day input[type=checkbox]:hover { border-color: var(--accent); }
    .day input[type=checkbox]:checked {
      background: var(--accent); border-color: var(--accent); animation: pop .3s ease;
    }
    @keyframes pop { 40% { transform: scale(1.2); } }
    .day input[type=checkbox]:checked::after {
      content: '✓'; color: #fff; font-size: 11px; font-weight: 800; line-height: 1;
    }
    .day.done { opacity: .45; }
    .day.done .t { text-decoration: line-through; }
    .phase-tag { color: var(--muted); font-size: 11.5px; margin-left: auto; }
    .prog { color: var(--muted); font-size: 12px; font-weight: 500; margin-left: auto; font-variant-numeric: tabular-nums; }
    .pts { padding: 0 4px 14px 45px; display: flex; flex-direction: column; gap: 8px; }
    .pts.hidden { display: none; }
    .pt { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
    .pt input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 16px; height: 16px; border: 1.5px solid #d4d4d8;
      border-radius: 99px; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; transition: all .15s;
    }
    .pt input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
    .pt input[type=checkbox]:checked::after { content: '✓'; color: #fff; font-size: 10px; font-weight: 800; line-height: 1; }
    .pt.done { color: var(--text); opacity: .75; }
    .pt.done .pt-t { text-decoration: line-through; }
    .cnt.green { color: var(--green); border-color: var(--green); background: #ecfdf5; }
  </style>
</head>
<body>
  <span class="preview-tag">ВАРИАНТ 2 · МИНИМАЛИЗМ</span>
  <header>
    <h1>Роадмап Python Backend Junior</h1>
    <div class="prog-panel" id="progPanel">
      <div class="prog-pct" id="progPct">0%</div>
      <div class="prog-right">
        <span class="prog-stats" id="progStats"></span>
        <div class="prog-track">
          <div class="prog-fill" id="progFill"></div>
        </div>
        <div class="prog-labels">
          <span>0</span>
          <span id="progMax"></span>
        </div>
      </div>
    </div>
  </header>
  <div id="list"></div>

  <script>
    const R = (typeof ROADMAP !== 'undefined') ? ROADMAP : (window.ROADMAP || {});
    const days = R.days || [];

    const groups = [];
    const groupIndex = {};
    for (const d of days) {
      const prefix = d.module.split(':')[0].trim();
      if (!(prefix in groupIndex)) {
        groupIndex[prefix] = groups.length;
        groups.push({ name: prefix, days: [], phase: d.phase });
      }
      groups[groupIndex[prefix]].days.push(d);
    }

    const done = JSON.parse(localStorage.getItem('brt_done') || '[]');
    const ptsDone = JSON.parse(localStorage.getItem('brt_pts') || '{}');
    const openPts = new Set();

    const openGroups = new Set();
    document.getElementById('list').addEventListener('toggle', e => {
      const details = e.target;
      const name = details.querySelector('.wk')?.textContent;
      if (!name) return;
      if (details.open) openGroups.add(name);
      else openGroups.delete(name);
    });

    function updateProgress() {
      const total = days.length;
      const doneCount = done.filter(id => id >= 1 && id <= total).length;
      const pct = Math.round(doneCount / total * 100);
      document.getElementById('progStats').innerHTML =
        'Изучено <b>' + doneCount + '</b> из <b>' + total + '</b> тем' +
        ' · ' + groups.length + ' блоков';
      document.getElementById('progPct').textContent = pct + '%';
      document.getElementById('progFill').style.width = pct + '%';
      document.getElementById('progMax').textContent = total;
    }

    function render() {
      updateProgress();

      const list = document.getElementById('list');
      list.innerHTML = groups.map(g => {
        const open = openGroups.has(g.name);
        const blockDone = g.days.every(d => done.includes(d.id));
        const blockCount = g.days.filter(d => done.includes(d.id)).length;
        return `
          <details ${open ? 'open' : ''}>
            <summary>
              <span class="arrow">▶</span>
              <span class="wk">${g.name}</span>
              <span class="cnt">${blockDone ? '✓ готово' : blockCount + '/' + g.days.length}</span>
            </summary>
            <div class="days">
              ${g.days.map(d => {
                const pts = d.points || [];
                const dp = ptsDone[d.id] || [];
                const doneCount = dp.length;
                const allDone = pts.length > 0 && doneCount === pts.length;
                const open = openPts.has(d.id);
                return `
                <div class="day ${done.includes(d.id)?'done':''}" data-id="${d.id}" onclick="togglePts(${d.id})">
                  <input type="checkbox" ${done.includes(d.id)?'checked':''} onclick="event.stopPropagation(); toggleDay(${d.id})">
                  <span class="t">${d.title}</span>
                  <span class="phase-tag">${d.module.split(':').slice(1).join(':').trim()}</span>
                  <span class="cnt ${allDone ? 'green' : ''}">${doneCount}/${pts.length}</span>
                </div>
                <div class="pts ${open ? '' : 'hidden'}" data-pts="${d.id}">
                  ${pts.map((p, i) => `
                    <label class="pt ${dp.includes(i)?'done':''}">
                      <input type="checkbox" ${dp.includes(i)?'checked':''} onchange="togglePt(${d.id},${i})">
                      <span class="pt-t">${p}</span>
                    </label>
                  `).join('')}
                </div>
                `;
              }).join('')}
            </div>
          </details>`;
      }).join('');
    }

    function toggleDay(id) {
      const i = done.indexOf(id);
      if (i >= 0) done.splice(i, 1);
      else done.push(id);
      localStorage.setItem('brt_done', JSON.stringify(done));
      const day = document.querySelector(`.day[data-id="${id}"]`);
      if (day) {
        day.classList.toggle('done', done.includes(id));
        const cb = day.querySelector('input[type=checkbox]');
        if (cb) cb.checked = done.includes(id);
        const details = day.closest('details');
        const group = details && details.querySelector('.wk')?.textContent;
        const g = groups.find(x => x.name === group);
        if (g && details) {
          const cnt = details.querySelector('.cnt');
          const blockCount = g.days.filter(d => done.includes(d.id)).length;
          const blockDone = g.days.every(d => done.includes(d.id));
          if (cnt) cnt.textContent = blockDone ? '✓ готово' : blockCount + '/' + g.days.length;
        }
        updateProgress();
      }
    }

    function togglePts(id) {
      if (openPts.has(id)) openPts.delete(id);
      else openPts.add(id);
      const el = document.querySelector(`.pts[data-pts="${id}"]`);
      if (el) el.classList.toggle('hidden');
    }

    function togglePt(id, idx) {
      let arr = ptsDone[id] || [];
      const i = arr.indexOf(idx);
      if (i >= 0) arr.splice(i, 1);
      else arr.push(idx);
      arr.sort((a, b) => a - b);
      ptsDone[id] = arr;
      localStorage.setItem('brt_pts', JSON.stringify(ptsDone));
      const pts = days.find(x => x.id === id)?.points || [];
      const cnt = document.querySelector(`.day[data-id="${id}"] .cnt`);
      if (cnt) {
        cnt.textContent = arr.length + '/' + pts.length;
        cnt.classList.toggle('green', pts.length > 0 && arr.length === pts.length);
      }
      const label = event.target.closest('.pt');
      if (label) label.classList.toggle('done', event.target.checked);
    }

    render();
  </script>
</body>
</html>
