<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайдбар D · Изразцы</title>
  <script src="../data.js"></script>
  <style>
    :root {
      --bg: #e8dcc3;
      --card: #faf3e3;
      --text: #33261a;
      --muted: #7d6b50;
      --accent: #c2410c;
      --green: #658a1e;
      --border: #3a2b18;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      background-image: repeating-linear-gradient(0deg, rgba(51,38,26,.025) 0 2px, transparent 2px 4px);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      line-height: 1.6;
      font-size: 15.5px;
      -webkit-font-smoothing: antialiased;
      max-width: 1140px;
      margin: 0 auto;
      padding: 36px 22px 80px;
    }
    .preview-tag {
      position: fixed; top: 12px; right: 12px; z-index: 1000;
      font-size: 11px; color: #fff; background: var(--accent);
      padding: 5px 12px; border-radius: 6px; font-weight: 700;
    }
    header h1 { font-family: Georgia, serif; font-size: 38px; font-weight: 800; letter-spacing: -.01em; }
    header .sub { font-family: Georgia, serif; font-style: italic; color: var(--muted); font-size: 15px; margin-top: 5px; }
    .shell { display: flex; gap: 20px; align-items: flex-start; margin-top: 24px; }
    .side { width: 300px; flex-shrink: 0; position: sticky; top: 16px; display: flex; flex-direction: column; gap: 7px; }
    .side-prog {
      background: var(--card); border: 2px solid var(--border);
      border-radius: 8px; padding: 16px 18px;
      box-shadow: 0 4px 14px rgba(51,38,26,.12);
      margin-bottom: 8px;
    }
    .sp-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px; }
    .sp-pct { font-family: Georgia, serif; font-size: 38px; font-weight: 800; color: var(--accent); line-height: 1; }
    .sp-l { font-size: 12.5px; color: var(--muted); font-weight: 600; }
    .sp-track { height: 12px; border-radius: 99px; background: #e6d9bc; border: 1.5px solid var(--border); overflow: hidden; }
    .sp-fill {
      height: 100%; width: 0%; border-radius: 99px;
      background: repeating-linear-gradient(-45deg, var(--accent) 0 9px, #d97316 9px 18px);
      transition: width .5s ease;
    }
    .nav-btn {
      display: flex; align-items: center; gap: 10px; width: 100%;
      text-align: left; padding: 12px 14px;
      background: var(--card); border: 2px solid var(--border); border-radius: 8px;
      cursor: pointer; font-size: 15px; font-weight: 650; color: var(--text);
      font-family: inherit; transition: all .12s;
    }
    #nav .nav-btn:nth-child(6n+1) { --c: #c2410c; }
    #nav .nav-btn:nth-child(6n+2) { --c: #a16207; }
    #nav .nav-btn:nth-child(6n+3) { --c: #556b2f; }
    #nav .nav-btn:nth-child(6n+4) { --c: #0f766e; }
    #nav .nav-btn:nth-child(6n+5) { --c: #9d174d; }
    #nav .nav-btn:nth-child(6n+6) { --c: #1d4ed8; }
    .nav-btn::before {
      content: '';
      width: 11px; height: 11px; border-radius: 3px;
      background: var(--c, var(--accent)); flex-shrink: 0;
      box-shadow: 0 0 0 1.5px var(--border);
    }
    .nav-btn:hover { border-color: var(--c, var(--accent)); }
    .nav-btn.active {
      border-color: var(--c, var(--accent));
      box-shadow: inset 0 0 0 2px var(--c, var(--accent));
      background: var(--card);
    }
    .nav-btn .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-btn .c { font-size: 12px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
    .nav-btn.complete .c { color: var(--green); }
    .main { flex: 1; min-width: 0; }
    .mhead {
      background: var(--card); border: 2px solid var(--border);
      border-radius: 8px; padding: 16px 20px; margin-bottom: 14px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      box-shadow: 0 4px 14px rgba(51,38,26,.12);
    }
    .mtitle { font-family: Georgia, serif; font-weight: 800; font-size: 23px; }
    .msub { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .mcount {
      font-size: 13px; color: var(--text); background: var(--bg);
      border: 2px solid var(--border); padding: 4px 13px; border-radius: 99px;
      white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .mcount.green { color: #fff; background: var(--green); border-color: var(--green); }
    .mlist { background: var(--card); border: 2px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 14px rgba(51,38,26,.12); }
    .day {
      padding: 13px 17px; font-size: 15.5px;
      border-bottom: 1px dashed #cdbb97;
      display: flex; gap: 11px; align-items: center;
      cursor: pointer; user-select: none; transition: background .12s;
    }
    .day:hover { background: #f3e9cf; }
    .day:last-child { border-bottom: none; }
    .day .t { flex: 1; font-weight: 500; }
    .day input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 21px; height: 21px; border: 2px solid #8a7355;
      border-radius: 50%; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; transition: all .15s;
    }
    .day input[type=checkbox]:hover { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(194,65,12,.15); }
    .day input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); animation: pop .3s ease; }
    @keyframes pop { 40% { transform: scale(1.25); } }
    .day input[type=checkbox]:checked::after { content: '\2713'; color: #fff; font-size: 12px; font-weight: 800; line-height: 1; }
    .day.done { opacity: .45; }
    .day.done .t { text-decoration: line-through; }
    .cnt { color: var(--muted); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .cnt.green { color: var(--green); }
    .pts { border-top: 1px dashed #cdbb97; padding: 12px 17px 14px 49px; display: none; }
    .pts.open { display: block; }
    .goal {
      font-family: Georgia, serif; font-style: italic;
      font-size: 14px; color: var(--muted); margin-bottom: 10px;
    }
    .goal b { color: var(--accent); font-style: normal; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; margin-right: 6px; }
    .pt { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); cursor: pointer; padding: 3px 0; }
    .pt input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 16px; height: 16px; border: 2px solid #8a7355;
      border-radius: 50%; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; transition: all .15s;
    }
    .pt input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
    .pt input[type=checkbox]:checked::after { content: '\2713'; color: #fff; font-size: 9px; font-weight: 800; line-height: 1; }
    .pt.done { color: var(--text); opacity: .75; }
    .pt.done .pt-t { text-decoration: line-through; }
    @media (max-width: 760px) {
      .shell { flex-direction: column; }
      .side { position: static; width: 100%; flex-direction: row; overflow-x: auto; padding-bottom: 8px; }
      .side-prog { min-width: 220px; }
      .nav-btn { width: auto; white-space: nowrap; }
      .nav-btn .n { max-width: 160px; }
    }
  </style>
</head>
<body>
  <span class="preview-tag">САЙДБАР D · ИЗРАЗЦЫ</span>
  <header>
    <h1>Роадмап Python Backend Junior</h1>
    <div class="sub">план обучения на четыре месяца</div>
  </header>

  <div class="shell">
    <aside class="side">
      <div class="side-prog">
        <div class="sp-top">
          <span class="sp-pct" id="progPct">0%</span>
          <span class="sp-l" id="progStats"></span>
        </div>
        <div class="sp-track"><div class="sp-fill" id="progFill"></div></div>
      </div>
      <div id="nav"></div>
    </aside>
    <main class="main" id="content"></main>
  </div>

  <script>
    const R = (typeof ROADMAP !== 'undefined') ? ROADMAP : (window.ROADMAP || {});
    const days = R.days || [];
    const PHASES = (R.meta && R.meta.phases) || {};

    const groups = [];
    const groupIndex = {};
    for (const d of days) {
      const prefix = d.module.split(':')[0].trim();
      if (!(prefix in groupIndex)) {
        groupIndex[prefix] = groups.length;
        groups.push({ name: prefix, days: [], phase: d.phase });
      }
      groups[groupIndex[prefix]].days.push(d);
    }

    const done = JSON.parse(localStorage.getItem('brt_done') || '[]');
    const ptsDone = JSON.parse(localStorage.getItem('brt_pts') || '{}');
    const openPts = new Set();

    let selGroup = (groups.find(g => !g.days.every(d => done.includes(d.id))) || groups[0]).name;

    function updateProgress() {
      const total = days.length;
      const doneCount = done.filter(id => id >= 1 && id <= total).length;
      const pct = Math.round(doneCount / total * 100);
      document.getElementById('progPct').textContent = pct + '%';
      document.getElementById('progFill').style.width = pct + '%';
      document.getElementById('progStats').textContent = doneCount + '/' + total + ' тем';
    }

    function renderNav() {
      document.getElementById('nav').innerHTML = groups.map(g => {
        const c = g.days.filter(d => done.includes(d.id)).length;
        const all = g.days.every(d => done.includes(d.id));
        return `
        <button class="nav-btn ${g.name === selGroup ? 'active' : ''} ${all ? 'complete' : ''}" onclick="selectGroup('${g.name.replace(/'/g, "\\'")}')">
          <span class="n">${g.name}</span>
          <span class="c">${all ? '✓' : c + '/' + g.days.length}</span>
        </button>`;
      }).join('');
    }

    function renderMain() {
      const g = groups.find(x => x.name === selGroup);
      if (!g) return;
      const ph = PHASES[g.phase];
      const c = g.days.filter(d => done.includes(d.id)).length;
      const all = g.days.every(d => done.includes(d.id));
      document.getElementById('content').innerHTML = `
        <div class="mhead">
          <div>
            <div class="mtitle">${g.name}</div>
            <div class="msub">${ph ? 'Фаза ' + g.phase + ' · ' + ph.name : ''}${ph && ph.days ? ' · ' + ph.days : ''}</div>
          </div>
          <span class="mcount ${all ? 'green' : ''}">${all ? '✓ блок завершён' : c + ' из ' + g.days.length}</span>
        </div>
        <div class="mlist">
          ${g.days.map(d => {
            const pts = d.points || [];
            const dp = ptsDone[d.id] || [];
            const allDone = pts.length > 0 && dp.length === pts.length;
            return `
            <div class="day ${done.includes(d.id)?'done':''}" data-id="${d.id}" onclick="togglePts(${d.id})">
              <input type="checkbox" ${done.includes(d.id)?'checked':''} onclick="event.stopPropagation(); toggleDay(${d.id})">
              <span class="t">${d.title}</span>
              <span class="cnt ${allDone ? 'green' : ''}">${dp.length}/${pts.length}</span>
            </div>
            <div class="pts ${openPts.has(d.id) ? 'open' : ''}" data-pts="${d.id}">
              ${d.goal ? `<div class="goal"><b>Цель</b>${d.goal}</div>` : ''}
              ${pts.map((p, i) => `
                <label class="pt ${dp.includes(i)?'done':''}">
                  <input type="checkbox" ${dp.includes(i)?'checked':''} onchange="togglePt(${d.id},${i})">
                  <span class="pt-t">${p}</span>
                </label>`).join('')}
            </div>`;
          }).join('')}
        </div>`;
    }

    function selectGroup(name) {
      selGroup = name;
      renderNav();
      renderMain();
    }

    function refreshNav() { renderNav(); }

    function toggleDay(id) {
      const i = done.indexOf(id);
      if (i >= 0) done.splice(i, 1);
      else done.push(id);
      localStorage.setItem('brt_done', JSON.stringify(done));
      const day = document.querySelector(`.day[data-id="${id}"]`);
      if (day) {
        day.classList.toggle('done', done.includes(id));
        const cb = day.querySelector('input[type=checkbox]');
        if (cb) cb.checked = done.includes(id);
      }
      const g = groups.find(x => x.days.some(d => d.id === id));
      if (g && g.name === selGroup) {
        const c = g.days.filter(d => done.includes(d.id)).length;
        const all = g.days.every(d => done.includes(d.id));
        const mc = document.querySelector('.mcount');
        if (mc) {
          mc.textContent = all ? '✓ блок завершён' : c + ' из ' + g.days.length;
          mc.classList.toggle('green', all);
        }
      }
      renderNav();
      updateProgress();
    }

    function togglePts(id) {
      if (openPts.has(id)) openPts.delete(id);
      else openPts.add(id);
      const el = document.querySelector(`.pts[data-pts="${id}"]`);
      if (el) el.classList.toggle('open');
    }

    function togglePt(id, idx) {
      let arr = ptsDone[id] || [];
      const i = arr.indexOf(idx);
      if (i >= 0) arr.splice(i, 1);
      else arr.push(idx);
      arr.sort((a, b) => a - b);
      ptsDone[id] = arr;
      localStorage.setItem('brt_pts', JSON.stringify(ptsDone));
      const pts = days.find(x => x.id === id)?.points || [];
      const cnt = document.querySelector(`.day[data-id="${id}"] .cnt`);
      if (cnt) {
        cnt.textContent = arr.length + '/' + pts.length;
        cnt.classList.toggle('green', pts.length > 0 && arr.length === pts.length);
      }
      const label = event.target.closest('.pt');
      if (label) label.classList.toggle('done', event.target.checked);
    }

    renderNav();
    renderMain();
    updateProgress();
  </script>
</body>
</html>
