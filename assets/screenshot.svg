    <text x="676" y="340" font-size="12" fill="#8a8a94" text-anchor="end">4/4</text>

    <rect x="24" y="366" width="712" height="54" rx="12" fill="#141419" stroke="rgba(255,255,255,.08)"/>
    <rect x="48" y="386" width="19" height="19" rx="6" stroke="#8a8a94" fill="none"/>
    <text x="82" y="390" font-size="16.5" fill="#eaeaef">Переменные окружения и .env</text>
    <text x="676" y="390" font-size="12" fill="#8a8a94" text-anchor="end">2/3</text>

    <rect x="24" y="426" width="712" height="54" rx="12" fill="#141419" stroke="rgba(255,255,255,.08)"/>
    <rect x="48" y="446" width="19" height="19" rx="6" stroke="#8a8a94" fill="none"/>
    <text x="82" y="450" font-size="16.5" fill="#eaeaef">Основы bash-скриптов</text>
    <text x="676" y="450" font-size="12" fill="#8a8a94" text-anchor="end">1/2</text>

    <rect x="24" y="486" width="712" height="54" rx="12" fill="#141419" stroke="rgba(255,255,255,.08)"/>
    <text x="48" y="518" font-size="15" fill="#4da8ff" font-weight="800">▸</text>
    <text x="72" y="520" font-size="19" font-weight="700" fill="#eaeaef">Python: ядро языка</text>
    <text x="676" y="520" font-size="12" font-weight="500" fill="#8a8a94" text-anchor="end">1/5</text>

    <rect x="24" y="546" width="712" height="54" rx="12" fill="#141419" stroke="rgba(255,255,255,.08)"/>
    <text x="48" y="578" font-size="15" fill="#4da8ff" font-weight="800">▸</text>
    <text x="72" y="580" font-size="19" font-weight="700" fill="#eaeaef">SQL: основы</text>
