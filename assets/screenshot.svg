  <g>
    <rect x="24" y="246" width="712" height="54" rx="12" fill="#141419" stroke="rgba(255,255,255,.08)"/>
    <text x="48" y="278" font-size="15" fill="#4da8ff" font-weight="800">▸</text>
    <text x="72" y="280" font-size="19" font-weight="700" fill="#eaeaef">Linux: терминал и bash</text>
    <text x="676" y="280" font-size="12" font-weight="500" fill="#8a8a94" text-anchor="end">3/3</text>

    <rect x="24" y="306" width="712" height="54" rx="12" fill="#141419" stroke="rgba(255,255,255,.08)"/>
    <rect x="48" y="326" width="19" height="19" rx="6" fill="#30d158"/>
    <text x="54" y="340" font-size="13" font-weight="800" fill="#fff">✓</text>
