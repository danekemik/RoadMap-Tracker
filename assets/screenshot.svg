    </linearGradient>
  </defs>

  <text x="48" y="116" font-size="17" font-weight="700" fill="#eaeaef">Изучено <tspan fill="#4da8ff">34</tspan> из <tspan fill="#eaeaef">98</tspan> тем</text>
  <text x="48" y="138" font-size="15" fill="#8a8a94">· 70 блоков</text>
