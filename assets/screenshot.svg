      <stop offset="1" stop-color="rgba(255,214,10,.10)"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset=".5" stop-color="#30d158"/>
