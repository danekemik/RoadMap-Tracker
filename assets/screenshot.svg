<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="-apple-system, 'Helvetica Neue', sans-serif">
  <rect width="760" height="640" rx="24" fill="#0b0b0f"/>
  <text x="32" y="52" font-size="22" font-weight="800" fill="#eaeaef">Роадмап Python Backend Junior</text>

  <rect x="24" y="72" width="712" height="150" rx="18" fill="url(#gp)" stroke="rgba(255,255,255,.12)"/>
